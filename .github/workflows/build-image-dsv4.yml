name: Build and Push Aiconfigurator NPU Image (DeepSeek-V4-Pro)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., v1, latest)'
        required: true
        default: 'latest'
      ref:
        description: 'Git ref to build (branch / tag / sha)'
        required: true
        default: 'feature/deepseek-v4-pro-support'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  IMAGE_NAME: 18896723947/aiconfigurator-npu-dsv4

jobs:
  build-and-push:
    name: Build and Push Aiconfigurator NPU Image (DeepSeek-V4-Pro)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dsv4
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed image ${{ steps.meta.outputs.tags }}"
