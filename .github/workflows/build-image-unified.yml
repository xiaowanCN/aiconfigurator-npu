name: Build and Push Unified Infer Strategy NPU Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., v1, latest)'
        required: true
        default: 'latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  IMAGE_NAME: 18896723947/aiconfigurator-npu-unified

jobs:
  build-and-push:
    name: Build and Push Unified Infer Strategy NPU Image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      # msmodeling whl 随仓库提交，这里只做存在性校验，避免构建到一半才失败
      - name: Verify msmodeling whl is present
        run: |
          set -euo pipefail
          ls -lh msmodeling_offline_installer/
          count=$(ls -1 msmodeling_offline_installer/*.whl 2>/dev/null | wc -l)
          [ "$count" -ge 1 ] \
            || { echo "::error::no whl found in msmodeling_offline_installer/; rebuild it from msmodeling source (see msmodeling_offline_installer/README.md)"; exit 1; }
          # 必须是从源码构建的新包：官方 26.1.0 缺少 cli/registry，跑不起来
          python - <<'PY'
          import glob, sys, zipfile
          path = sorted(glob.glob("msmodeling_offline_installer/*.whl"))[0]
          names = zipfile.ZipFile(path).namelist()
          if not any(n.startswith("cli/registry/") for n in names):
              sys.exit(f"::error::{path} has no cli/registry/ - it is a stale official build; rebuild from source")
          print("whl ok:", path, "files:", len(names))
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.unified
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed image ${{ steps.meta.outputs.tags }}"
