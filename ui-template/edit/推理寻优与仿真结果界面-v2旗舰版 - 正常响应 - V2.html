<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智算调优平台 · 推理策略寻优与仿真结果 V2 旗舰版</title>
<style>
  :root{
    --sidebar-bg:#0a1f3c; --sidebar-hover:#14304c;
    --primary:#1668dc; --primary-dark:#0e56c0; --primary-2:#3d8bfd;
    --bg:#f2f4f8; --card:#ffffff; --border:#e6eaf1; --border-dark:#d6dce6;
    --text:#1c2532; --text-2:#55637a; --text-3:#8b96a8;
    --green:#0f9d58; --green-bg:#e6f6ec;
    --orange:#e8890c; --orange-bg:#fdf3e3;
    --red:#e1463e; --red-bg:#fdecea;
    --blue-bg:#e9f1fe; --blue-line:#cfe0ff;
    --violet:#7c3aed; --violet-bg:#f3edfc; --violet-line:#ddd0f5;
    --teal:#0d9488; --teal-bg:#e6f6f3;
    --radius:10px; --shadow:0 1px 3px rgba(28,37,50,.05);
    --shadow-hover:0 12px 28px rgba(28,37,50,.11);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue","Segoe UI",Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}
  .num,.ov-cell .v,.stat .v,.dim-card .v,.kv td.num,.hero p b,.tput-item b,.tput-kpi .v{
    font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px;
  }
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9d2de;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ============ 平台外壳 ============ */
  .layout{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:214px;flex-shrink:0;display:flex;flex-direction:column;color:#c6d3e2;
    background:linear-gradient(180deg,#0a1f3c 0%,#0c2547 100%);}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
  .logo-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:#fff;background:linear-gradient(135deg,#3d8bfd,#1250b5);box-shadow:0 2px 8px rgba(22,104,220,.45);}
  .logo-icon svg{width:19px;height:19px;}
  .logo-name{font-size:15px;font-weight:600;color:#fff;line-height:1.25;}
  .logo-sub{font-size:10px;color:#6f8cab;letter-spacing:.4px;}
  .menu{flex:1;padding:12px 10px;}
  .menu-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
    font-size:13.5px;margin-bottom:4px;color:#a9bcd4;position:relative;transition:all .18s;}
  .menu-item svg{width:16px;height:16px;flex-shrink:0;}
  .menu-item:hover{background:#14304c;color:#e6eef7;}
  .menu-item.active{background:linear-gradient(90deg,rgba(61,139,253,.22),rgba(61,139,253,.08));color:#fff;font-weight:500;}
  .menu-item.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;
    border-radius:0 3px 3px 0;background:#3d8bfd;}
  .menu-item .arrow{margin-left:auto;font-size:10px;color:#5f7ea3;}
  .space-bar{padding:13px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;}
  .space-dot{width:8px;height:8px;border-radius:50%;background:#2fbf71;flex-shrink:0;box-shadow:0 0 6px rgba(47,191,113,.8);}
  .space-name{font-size:12px;color:#c6d3e2;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .space-btn{background:#24466e;color:#dce7f2;border:none;border-radius:5px;font-size:11px;padding:3px 10px;cursor:pointer;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:50px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
    padding:0 18px;gap:12px;flex-shrink:0;}
  .btn-back{display:flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--primary);border:none;
    border-radius:17px;padding:6px 15px;font-size:13px;cursor:pointer;transition:background .18s;}
  .btn-back:hover{background:#d9e8fd;}
  .crumb{font-size:13px;color:var(--text-3);}
  .crumb b{color:var(--text);font-weight:500;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);}
  .avatar{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#4d8ef7,#1668dc);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;}
  .mode-badge{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:4px 12px 4px 6px;
    font-size:12px;font-weight:600;border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--primary-dark);}
  .mode-badge.disagg{border-color:var(--violet-line);background:var(--violet-bg);color:#6d3cc4;}
  .mode-badge .mb-ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#3d8bfd,#1250b5);color:#fff;}
  .mode-badge.disagg .mb-ico{background:linear-gradient(135deg,#a273f2,#6d3cc4);}
  .mode-badge .mb-ico svg{width:12px;height:12px;}
  .mode-badge .mb-hint{font-size:10.5px;font-weight:400;opacity:.72;border-left:1px solid currentColor;padding-left:8px;}
  .content{flex:1;overflow-y:auto;padding:20px 26px 40px;}
  .content-inner{max-width:1240px;margin:0 auto;}

  /* ============ 章节导航（与三方页一致：锚点跳转） ============ */
  .section-nav{display:flex;align-items:center;gap:5px;padding:6px;margin-bottom:18px;
    border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--shadow);overflow-x:auto;}
  .section-nav a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;
    border-radius:7px;color:var(--text-2);font-size:12px;text-decoration:none;white-space:nowrap;
    transition:background .15s,color .15s;}
  .section-nav a span{font:11px var(--mono);color:#97a6bc;}
  .section-nav a:hover,.section-nav a:focus-visible{background:#edf4ff;color:var(--primary);}
  .section-nav a:focus-visible{outline:2px solid #91baff;outline-offset:-2px;}

  /* ============ 章节标题（左对齐层级） ============ */
  .sec-conn{display:flex;align-items:center;gap:12px;min-height:46px;margin:25px 0 10px;scroll-margin-top:18px;}
  .sec-conn:first-of-type{margin-top:2px;}
  .sec-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex-shrink:0;
    border:1px solid #d9e6f8;border-radius:10px;color:var(--primary);
    background:linear-gradient(145deg,#fff 0%,#eaf2ff 100%);box-shadow:0 2px 5px rgba(22,104,220,.04);}
  .sec-icon svg{width:19px;height:19px;}
  .sec-heading{margin:0;font-size:16px;font-weight:600;line-height:1.4;letter-spacing:.4px;color:#24344b;}
  .sec-rule{flex:1;min-width:12px;height:1px;margin-left:8px;
    background:linear-gradient(90deg,#dbe2ed,rgba(219,226,237,.25));}
  .sec-extra{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid #dcece5;
    border-radius:6px;background:#f4faf7;font-size:11px;color:var(--text-2);white-space:nowrap;}
  .sec-extra b{color:#16815a;font-weight:500;}
  .sec-index{padding-left:12px;border-left:1px solid #dce3ee;color:#9aa8bc;
    font:500 12px/1 var(--mono);letter-spacing:1px;}

  /* ============ 首部（浅色，与三方页同色系） ============ */
  .hero{position:relative;overflow:hidden;border:1px solid #e1eaf6;border-radius:12px;
    padding:18px 22px 17px;background:linear-gradient(110deg,#f6f9ff 0%,#fff 70%);
    box-shadow:0 2px 10px rgba(22,104,220,.05);}
  .hero::before{content:"";position:absolute;right:-70px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(61,139,253,.10),rgba(61,139,253,0) 70%);pointer-events:none;}
  .hero>*{position:relative;z-index:1;}
  .hero-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .hero h1{font-size:21px;font-weight:700;letter-spacing:.3px;color:#1c2532;}
  .hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border-radius:20px;padding:3px 11px;
    background:var(--green-bg);border:1px solid #c8e9d5;color:var(--green);}
  .hero-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(15,157,88,.14);}
  .hero p{font-size:13px;line-height:1.8;color:var(--text-2);margin-top:9px;max-width:980px;}
  .hero p b{color:var(--primary);font-weight:600;font-family:inherit;}

  /* ============ 通用卡片 ============ */
  .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px 18px;box-shadow:var(--shadow);margin-bottom:12px;
    transition:transform .2s,box-shadow .2s,border-color .2s;}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg,#9dc3f5,#e6eaf1);}
  .card.tone-violet::before{background:linear-gradient(90deg,#c9b0f2,#e6eaf1);}
  .card.tone-teal::before{background:linear-gradient(90deg,#9bd9cd,#e6eaf1);}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#d6e0ee;}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .card-title{font-size:14.5px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .card-title .ico{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--blue-bg);color:var(--primary);}
  .card-title .ico svg{width:15px;height:15px;}
  .card-title.violet .ico{background:var(--violet-bg);color:var(--violet);}
  .card-title.teal .ico{background:var(--teal-bg);color:var(--teal);}
  .card-title.amber .ico{background:var(--orange-bg);color:var(--orange);}
  .card-sub{font-size:11.5px;color:var(--text-3);}
  .card-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .note{font-size:11.5px;color:var(--text-2);line-height:1.75;margin:2px 0 13px;
    background:linear-gradient(90deg,#f6f9ff,rgba(246,249,255,0));border-left:3px solid #c9dcfb;
    padding:7px 12px;border-radius:0 6px 6px 0;}
  .note b{color:var(--primary-dark);font-weight:600;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:20px;padding:2px 10px;font-weight:600;flex-shrink:0;}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tag.ok{background:var(--green-bg);color:var(--green);}
  .tag.info{background:var(--blue-bg);color:var(--primary-dark);}
  .tag.violet{background:var(--violet-bg);color:#6d3cc4;}
  .tag.rose{background:var(--red-bg);color:var(--red);}
  .tag.ghost{background:#f1f4f9;color:var(--text-2);}
  .tag.ghost::before{display:none;}

  /* ============ 任务信息：两行罗列，无标题无旁白 ============ */
  .ov-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ov-model{font-size:16px;font-weight:600;letter-spacing:.2px;}
  .ov-id{font-family:var(--mono);font-size:11px;color:var(--text-3);background:#f0f3f7;border-radius:4px;padding:2px 8px;}
  .ov-cost{margin-left:auto;font-size:12px;color:var(--text-3);}
  .ov-cost b{color:var(--text-2);font-weight:500;}
  .ov-specs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:13px;padding-top:12px;
    border-top:1px solid var(--border);}
  .ov-cell{padding:0 16px 12px;border-right:1px solid var(--border);min-width:0;}
  .ov-cell:nth-child(4n){border-right:none;}
  .ov-cell:nth-child(n+5){padding-top:12px;border-top:1px solid var(--border);}
  .ov-cell:nth-child(1){padding-left:0;}
  .ov-cell .k{font-size:11.5px;color:var(--text-3);margin-bottom:4px;}
  .ov-cell .v{font-size:14.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ov-cell .v small{font-size:11px;font-weight:400;color:var(--text-3);font-family:inherit;}

  .group-head{display:flex;align-items:center;gap:9px;margin:18px 0 10px;}
  .card>.group-head:first-child{margin-top:8px;}
  .group-head .dot{width:7px;height:7px;border-radius:2px;background:var(--primary);flex-shrink:0;}
  .group-head .t{font-size:12.5px;font-weight:700;white-space:nowrap;}
  .group-head .rule{flex:1;height:1px;background:#eef1f6;}
  .group-head.violet .dot{background:var(--violet);}
  .group-head.teal .dot{background:var(--teal);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;}
  .stat{position:relative;background:#fbfcfe;border:1px solid var(--border);border-radius:10px;padding:11px 13px 10px;
    transition:transform .2s,box-shadow .2s,border-color .2s;cursor:help;}
  .stat::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;border-radius:0 2px 2px 0;
    background:var(--primary);opacity:.5;}
  .stat:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(28,37,50,.10);border-color:#c9d9f2;z-index:2;}
  .stat.violet::before{background:var(--violet);}
  .stat.teal::before{background:var(--teal);}
  .stat .cn{font-size:11.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:5px;}
  .stat .cn .u{font-size:10px;color:var(--text-3);font-weight:400;}
  .stat .v{font-size:21px;font-weight:700;line-height:1.35;word-break:break-all;color:var(--text);}
  .stat .v span.txt{font-size:13px;letter-spacing:0;}
  .stat .d{font-size:10px;color:var(--text-3);line-height:1.5;margin-top:5px;
    border-top:1px dashed var(--border);padding-top:5px;}
  .bool{font-family:var(--mono);font-size:12px;font-weight:700;border-radius:5px;padding:2px 9px;}
  .bool.yes{color:var(--green);background:var(--green-bg);border:1px solid #bfe6d2;}
  .bool.no{color:var(--red);background:var(--red-bg);border:1px solid #f6cfcb;}
  .null-pill{font-family:var(--mono);font-size:10.5px;color:var(--text-3);background:#f1f4f8;
    border:1px solid #e6ebf2;border-radius:5px;padding:2px 8px;}

  /* ============ 采集信息 ============ */
  .hw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
  .hw-group{background:linear-gradient(180deg,#f9fbff,#fff);border:1px solid var(--border);border-radius:10px;
    padding:12px 13px;transition:transform .2s,box-shadow .2s;}
  .hw-group:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(28,37,50,.09);}
  .hw-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .hw-ico{width:27px;height:27px;border-radius:7px;background:var(--teal-bg);color:var(--teal);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hw-ico svg{width:14px;height:14px;}
  .hw-name{font-size:12.5px;font-weight:700;}
  .hw-cnt{font-size:10px;color:var(--text-3);margin-left:auto;font-family:var(--mono);}
  .hw-items{display:flex;flex-direction:column;gap:5px;}
  .hw-item{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #eef2f8;
    border-radius:6px;padding:5px 8px;min-width:0;}
  .hw-item .tick{color:var(--green);flex-shrink:0;}
  .hw-item .tick svg{width:12px;height:12px;display:block;}
  .hw-item .cn{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ============ 部署策略：浅色底 + 彩色边框 ============ */
  .strat-hero{position:relative;border:1.5px solid #b9d3f7;border-radius:12px;padding:16px 18px 18px;
    background:linear-gradient(160deg,#f8fbff,#fff 70%);box-shadow:0 2px 10px rgba(22,104,220,.05);}
  .strat-hero.disagg{border-color:#d5c2f3;background:linear-gradient(160deg,#fbf8ff,#fff 70%);}
  .strat-hero>*{position:relative;z-index:1;}
  .sh-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px;}
  .sh-title{font-size:14px;font-weight:700;color:#24518d;display:flex;align-items:center;gap:8px;}
  .sh-title svg{width:16px;height:16px;}
  .sh-tag{font-size:10.5px;border-radius:20px;padding:2px 10px;background:var(--blue-bg);
    border:1px solid var(--blue-line);color:var(--primary-dark);}
  .strat-hero.disagg .sh-tag{background:var(--violet-bg);border-color:var(--violet-line);color:#6d3cc4;}
  .sh-formula{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-2);}
  .dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
  .dim-card{position:relative;border:1.5px solid #cfe0ff;border-radius:10px;background:#fff;
    padding:14px 12px 13px;text-align:center;overflow:hidden;color:var(--text);
    transition:transform .22s,box-shadow .22s,border-color .22s;cursor:help;}
  .dim-card::after{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;
    background:rgba(22,104,220,.05);}
  .dim-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 10px 20px rgba(22,104,220,.13);}
  .dim-card .abbr{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--primary);}
  .dim-card .v{font-size:34px;font-weight:800;line-height:1.15;color:var(--primary-dark);}
  .dim-card .cn{font-size:11.5px;font-weight:600;color:var(--text-2);}
  .dim-card .d{font-size:9.5px;line-height:1.5;color:var(--text-3);margin-top:5px;
    border-top:1px solid #eef1f6;padding-top:5px;}
  .sh-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:10.5px;color:var(--text-2);}
  .sh-foot .chip{background:#f6f9ff;border:1px solid #e3ebf7;border-radius:20px;padding:2px 10px;}

  /* 卡组分配：保持原样式，仅按形态让边框颜色对应 */
  .topo{margin-top:14px;background:linear-gradient(180deg,#f8faff,#fff);border:1px dashed #cbd9f0;
    border-radius:10px;padding:13px 15px;}
  .card.tone-violet .topo{border-color:#d5c2f3;background:linear-gradient(180deg,#fbf9ff,#fff);}
  .topo-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:10px;}
  .topo-head .legend{margin-left:auto;display:flex;gap:12px;font-size:10px;font-weight:400;color:var(--text-3);}
  .topo-head .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  .topo-row{display:flex;gap:8px;flex-wrap:wrap;}
  .node-box{background:#fff;border:1px solid #dde7f6;border-radius:8px;padding:7px 9px;transition:box-shadow .2s,transform .2s;}
  .node-box:hover{box-shadow:0 6px 14px rgba(28,37,50,.10);transform:translateY(-2px);}
  .node-label{font-family:var(--mono);font-size:9px;color:var(--text-3);margin-bottom:5px;}
  .node-cells{display:flex;gap:3px;flex-wrap:wrap;}
  .cell{width:13px;height:13px;border-radius:3px;background:linear-gradient(135deg,#4d8ef7,#1668dc);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
  .cell.p{background:linear-gradient(135deg,#5ed2c0,#0d9488);}
  .cell.d{background:linear-gradient(135deg,#b18af5,#7c3aed);}

  /* PD 分离子栏 */
  .sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sub{border:1px solid var(--border);border-radius:11px;padding:13px 14px 15px;
    background:linear-gradient(180deg,#fbfcff,#fff 60%);transition:transform .2s,box-shadow .2s;}
  .sub:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(28,37,50,.09);}
  .sub-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 9px;}
  .badge.p{color:var(--primary-dark);background:var(--blue-bg);border:1px solid var(--blue-line);}

/* ==================== 5. 通用工具 ==================== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const fmt = n => (typeof n === "number" && isFinite(n))
  ? n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : esc(n);
const valHtml = v => {
  if (v === null || v === undefined) return '<span class="null-pill">无数据</span>';
  if (v === true)  return '<span class="bool yes">满足</span>';
  if (v === false) return '<span class="bool no">未满足</span>';
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : fmt(v);
  const s = esc(v);
  return `<span class="${String(v).length>16?"txt":""}">${s}</span>`;
};
const flat = (obj,prefix="") => Object.entries(obj||{}).flatMap(([k,v]) =>
  isObj(v) ? flat(v,prefix+k+".") : [[prefix+k,v]]);
const pick = (pairs,keys) => keys.map(k=>pairs.find(([n])=>n===k)).filter(Boolean);
const timeText = s => s ? String(s).replace("T"," ").replace(/\+08:00/,"") : "—";
function durationText(a,b){
  const d = new Date(b) - new Date(a);
  if (!isFinite(d) || d < 0) return "—";
  const m = Math.floor(d/60000), s = Math.round((d%60000)/1000);
  return m>0 ? `${m} 分 ${s} 秒` : `${s} 秒`;
}

/* ==================== 6. 数据解析 ==================== */
function readOptimize(resp){
  const node = resp && resp.common && resp.common.infer_strategy_npu;
  if (!node) return { ok:false, reason:"响应缺少 common.infer_strategy_npu 节点" };
  const d = node.data || {}, result = d.result || {};
  const agg = (result.agg && Array.isArray(result.agg.candidates)) ? result.agg.candidates : [];
  const dis = (result.disagg && Array.isArray(result.disagg.candidates)) ? result.disagg.candidates : [];
  const mode = agg.length ? "agg" : (dis.length ? "disagg" : null);
  const candidate = mode === "agg" ? agg[0] : (mode === "disagg" ? dis[0] : null);
  return {
    ok: !!candidate, mode, candidate, request: d.request || {},
    times: { created:d.created_at, started:d.started_at, finished:d.finished_at },
    status: { code:node.code, status:node.status, message:node.message },
    count: mode === "agg" ? agg.length : dis.length,
    reason: "寻优响应中 agg / disagg 均无 candidates"
  };
}
function readSimulate(resp){
  const node = resp && resp.common && resp.common.infer_simulate;
  if (!node || !node.data) return { ok:false, reason:"响应缺少 common.infer_simulate.data 节点" };
  return { ok:true, data:node.data, status:{ code:node.code, status:node.status, message:node.message } };
}

  const W=460,H=196,padL=38,padR=10,padT=18,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const maxV = Math.max(...latencyKeys.flatMap(k=>cols.map(c=>Number(d[k]&&d[k][c])||0)),1)*1.18;
  const ticks = [0,1,2,3,4].map(i=>maxV*i/4);
  const gridSvg = ticks.map(t=>{
    const y = padT+plotH*(1-t/maxV);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${t===0?"#c9d2de":"#eef1f5"}" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3.5}" text-anchor="end" font-size="9" fill="#8b96a8" font-family="Consolas,monospace">${Math.round(t)}</text>`;
  }).join("");
  const colors = ["#1668dc","#7c3aed","#0d9488"];
  const groupW = plotW/latencyKeys.length, barW=20, gap=5;
  let bars = "";
  latencyKeys.forEach((k,gi)=>{
    const cx = padL+groupW*gi+groupW/2;
    cols.forEach((c,ci)=>{
      const v = Number(d[k]&&d[k][c])||0;
      const h = plotH*(v/maxV), x = cx-(barW*3+gap*2)/2+ci*(barW+gap), y = padT+plotH-h;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(0,h)}" rx="3" fill="${colors[ci]}" opacity="${0.55+ci*0.2}"/>
        <text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="${colors[ci]}">${Math.round(v)}</text>`;
    });
    bars += `<text x="${cx}" y="${H-11}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#55637a">${esc(fieldOf(k)[0]||k)}</text>`;
  });
  const tableRows = latencyKeys.map(k=>{
    const f = fieldOf(k);
    return `<tr><td class="k">${esc(f[0]||k)}</td>
      ${cols.map(c=>`<td class="num">${valHtml(d[k]?d[k][c]:null)}</td>`).join("")}
      <td class="desc">${esc(f[2]||"")}</td></tr>`;
  }).join("");

  return `<div class="card tone-teal">
    ${cardHead("仿真结果总览","PD 混部 / PD 分离下游输出格式统一",
      `<span class="tag ok">仿真成功</span><span class="tag ghost">${esc(ctx.sim.status.message||"")}</span>`,"teal")}
    ${groupHead("请求与规模","teal")}
    ${grid(scale,"teal")}
    ${groupHead("吞吐指标","teal")}
    ${grid(tput,"teal")}
    <div class="chart-grid" style="margin-top:13px">
      <div class="chart-card">
        <div class="chart-head"><span class="chart-title">吞吐构成</span></div>
        <div class="chart-sub">Prefill 输入吞吐 + Decode 生成吞吐 = 总吞吐（${esc(fmt(total))} tokens/s）</div>
        ${tputChart(pp,gp,total)}
        <div class="tput-bar"><div class="seg1" style="width:${w1.toFixed(1)}%"></div><div class="seg2" style="width:${w2.toFixed(1)}%"></div></div>
        <div class="tput-bar-legend">
          <span class="tput-item"><i class="lg-dot" style="background:#1668dc"></i>Prefill <b>${esc(fmt(pp))}</b> · ${w1.toFixed(1)}%</span>
          <span class="tput-item"><i class="lg-dot" style="background:#0d9488"></i>Decode <b>${esc(fmt(gp))}</b> · ${w2.toFixed(1)}%</span>
        </div>
        <div class="tput-kpis">
          <div class="tput-kpi"><div class="k">输入处理占比</div><div class="v">${w1.toFixed(1)}<small> %</small></div></div>
          <div class="tput-kpi"><div class="k">生成 / 输入吞吐比</div><div class="v">${genRatio.toFixed(1)}<small> %</small></div></div>
          <div class="tput-kpi"><div class="k">Token 总量</div><div class="v">${esc(tokenSum.toLocaleString("en-US"))}<small> tokens</small></div></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><span class="chart-title">时延分位对比</span></div>
        <div class="chart-sub">TTFT / TPOT / ITL 的平均值、中位数与 P99（单位 ms）</div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="时延分位柱状图">${gridSvg}${bars}</svg>
        <div class="legend-row">
          ${cols.map((c,i)=>`<span><i class="lg-dot" style="background:${colors[i]}"></i>${esc(fieldOf(c)[0]||c)}</span>`).join("")}
        </div>
        <div class="chart-sub" style="margin-top:10px;margin-bottom:0">P99 与均值的差距反映长尾时延；三项指标共用同一纵轴刻度（ms）。</div>
      </div>
    </div>
    ${groupHead("时延分位明细","teal")}
    <div class="table-wrap"><table class="kv">
      <thead><tr><th>指标名称</th>${cols.map(c=>`<th>${esc(fieldOf(c)[0]||c)}</th>`).join("")}<th style="text-align:left">指标说明</th></tr></thead>
      <tbody>${tableRows}</tbody></table></div>
    ${rest.length?groupHead("其他仿真字段","teal")+grid(rest,"teal"):""}
  </div>`;
}

/* ==================== 14. 页面组装 ==================== */
function modeBadgeHtml(mode){
  const label = mode === "agg" ? "PD 混部" : (mode === "disagg" ? "PD 分离" : "形态未知");
  return `<span class="mode-badge ${mode==="disagg"?"disagg":""}">
    <span class="mb-ico">${icon(mode==="disagg"?"split":"chip")}</span>
    <span>当前部署形态 · ${esc(label)}</span>
    <span class="mb-hint">由结果数据自动识别</span></span>`;
}
function footerHtml(current){
  const btn = (m,label) => `<button type="button" class="demo-btn ${current===m?"active":""}" data-demo="${m}">${esc(label)}</button>`;
  return `<div class="footer">
    <div class="demo"><span class="lb">演示数据（默认 PD 分离 · 仅用于预览两种响应格式）</span>
      ${btn("disagg","PD 分离示例")}${btn("agg","PD 混部示例")}</div>
    <span class="spacer"></span>
    <span>真实接入：<code>window.INFER_OPT_RESULT</code> / <code>window.INFER_SIM_RESULT</code>
      或调用 <code>window.renderInferReport(opt, sim)</code></span>
    <button class="btn primary" type="button" id="printBtn">${icon("print")} 打印报告</button>
  </div>`;
}
function render(optResp,simResp,currentDemo){
  const opt = readOptimize(optResp), sim = readSimulate(simResp);
  if (!opt.ok || !sim.ok){
    document.getElementById("detailArea").innerHTML =
      `<div class="card"><div class="empty"><b>数据解析失败</b>
        ${esc(!opt.ok?("寻优响应："+opt.reason):"")} ${esc(!sim.ok?("仿真响应："+sim.reason):"")}</div></div>`;
    document.getElementById("modeBadge").innerHTML = modeBadgeHtml(null);
    document.getElementById("hero").innerHTML = "";
    document.getElementById("footer").innerHTML = footerHtml(currentDemo);
    bindFooter(currentDemo);
    return;
  }
  const ctx = { opt, sim, mode:opt.mode };
  document.getElementById("modeBadge").innerHTML = modeBadgeHtml(opt.mode);
  document.getElementById("hero").innerHTML = heroHtml(ctx);
  document.getElementById("detailArea").innerHTML =
    sectionNavHtml() +
    secConn("01","任务信息",`响应码 <b>${esc(opt.status.code)}</b>`) +
    overviewHtml(ctx) +
    secConn("02","信息采集",`${COLLECT.reduce((s,g)=>s+g[1].length,0)} 项 · <b>已采集</b>`) +
    collectHtml() +
    secConn("03","推理寻优",`${esc(opt.mode==="agg"?"PD 混部":"PD 分离")} · <b>候选 ${esc(opt.count)} 条</b>`) +
    (opt.mode === "agg" ? strategyAggHtml(ctx) : strategyDisaggHtml(ctx)) +
    secConn("04","模拟仿真","<b>吞吐 / TTFT / TPOT / ITL</b>") +
    simulateHtml(ctx) +
    secConn("05","技术原理","<b>推理寻优示意</b>") +
    principleDiagram();
  document.getElementById("footer").innerHTML = footerHtml(currentDemo);
  bindFooter(currentDemo);
  bindTools();
}
function bindFooter(currentDemo){
  document.querySelectorAll("[data-demo]").forEach(b=>{
    b.addEventListener("click",()=>render(DEMO_OPT[b.dataset.demo],DEMO_SIM,b.dataset.demo));
  });
}
function bindTools(){
  const printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click",()=>window.print());
}

document.getElementById("logoIcon").innerHTML = icon("logo");
document.getElementById("sideMenu").innerHTML = [
  ["grid","集群总览",true],["target","调优工作台",false],["pulse","监控诊断中心",false],
  ["chip","模型调优",false],["doc","文档中心",false]
].map(([ico,name,arrow])=>`<div class="menu-item${name==="模型调优"?" active":""}">${icon(ico)}${esc(name)}${arrow?'<span class="arrow">▸</span>':""}</div>`).join("");

/* 默认优先展示 PD 分离；?demo=agg 可显式切到 PD 混部 */
const initialDemo = new URLSearchParams(location.search).get("demo") === "agg" ? "agg" : "disagg";
const injectedOpt = window.INFER_OPT_RESULT, injectedSim = window.INFER_SIM_RESULT;
window.renderInferReport = (o,s) => render(o,s,"custom");
render(injectedOpt || DEMO_OPT[initialDemo], injectedSim || DEMO_SIM, injectedOpt ? "custom" : initialDemo);
</script>
