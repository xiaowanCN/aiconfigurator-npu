<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智算调优平台 · 推理策略寻优与仿真结果 V2 旗舰版</title>
<style>
  :root{
    --sidebar:#0a1f3c; --sidebar-2:#0c2547;
    --blue:#1668dc; --blue-d:#0e56c0; --violet:#7c3aed; --teal:#0d9488;
    --amber:#d97706; --rose:#e11d48; --green:#0f9d58;
    --blue-bg:#e9f1fe; --violet-bg:#f2ecfe; --teal-bg:#e6f6f3;
    --green-bg:#e6f6ec; --amber-bg:#fdf3e3; --rose-bg:#fdecea;
    --bg:#f3f6fb; --card:#ffffff; --line:#e6eaf1; --line-2:#eef2f8;
    --ink:#17243c; --muted:#475569; --faint:#7b8aa1;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --shadow:0 1px 2px rgba(23,36,60,.04),0 10px 28px rgba(23,36,60,.055);
    --shadow-hover:0 16px 36px rgba(23,36,60,.14);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue","Segoe UI",Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;
  }
  .num,.stat .v,.dim-card .v,.hero-kpi .v,.ov-cell .v,.cs-val,.kv td.num,.raw-pre{
    font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px;
  }
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9d2de;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ============ 平台外壳 ============ */
  .layout{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:214px;flex-shrink:0;display:flex;flex-direction:column;color:#c6d3e2;
    background:linear-gradient(180deg,#0a1f3c 0%,#0c2547 100%);}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
  .logo-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:#fff;background:linear-gradient(135deg,#3d8bfd,#1250b5);box-shadow:0 2px 8px rgba(22,104,220,.45);}
  .logo-icon svg{width:19px;height:19px;}
  .logo-name{font-size:15px;font-weight:600;color:#fff;line-height:1.25;}
  .logo-sub{font-size:10px;color:#6f8cab;letter-spacing:.4px;}
  .menu{flex:1;padding:12px 10px;}
  .menu-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
    font-size:13.5px;margin-bottom:4px;color:#a9bcd4;position:relative;transition:all .18s;}
  .menu-item svg{width:16px;height:16px;flex-shrink:0;}
  .menu-item:hover{background:#14304c;color:#e6eef7;}
  .menu-item.active{background:linear-gradient(90deg,rgba(61,139,253,.22),rgba(61,139,253,.08));color:#fff;font-weight:500;}
  .menu-item.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;
    border-radius:0 3px 3px 0;background:#3d8bfd;}
  .menu-item .arrow{margin-left:auto;font-size:10px;color:#5f7ea3;}
  .space-bar{padding:13px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;}
  .space-dot{width:8px;height:8px;border-radius:50%;background:#2fbf71;flex-shrink:0;box-shadow:0 0 6px rgba(47,191,113,.8);}
  .space-name{font-size:12px;color:#c6d3e2;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .space-btn{background:#24466e;color:#dce7f2;border:none;border-radius:5px;font-size:11px;padding:3px 10px;cursor:pointer;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 18px;gap:12px;flex-shrink:0;}
  .btn-back{display:flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--blue);border:none;
    border-radius:17px;padding:6px 15px;font-size:13px;cursor:pointer;transition:background .18s;}
  .btn-back:hover{background:#d9e8fd;}
  .crumb{font-size:13px;color:var(--faint);}
  .crumb b{color:var(--ink);font-weight:600;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  .avatar{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#4d8ef7,#1668dc);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;}

  /* 部署形态只读徽章：替代原来的「PD混部 / PD分离」切换按钮 */
  .mode-badge{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:4px 12px 4px 6px;
    font-size:12px;font-weight:600;border:1px solid var(--blue-bg);background:var(--blue-bg);color:var(--blue-d);
    box-shadow:0 1px 3px rgba(22,104,220,.12);}
  .mode-badge.disagg{border-color:#e6d9fb;background:var(--violet-bg);color:#6d3cc4;}
  .mode-badge .mb-ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#3d8bfd,#1250b5);color:#fff;}
  .mode-badge.disagg .mb-ico{background:linear-gradient(135deg,#a273f2,#6d3cc4);}
  .mode-badge .mb-ico svg{width:12px;height:12px;}
  .mode-badge .mb-hint{font-size:10.5px;font-weight:400;opacity:.72;border-left:1px solid currentColor;padding-left:8px;}

  .content{flex:1;overflow-y:auto;padding:20px 26px 40px;}
  .content-inner{max-width:1240px;margin:0 auto;}

  /* ============ 顶部 Hero ============ */
  .hero{position:relative;overflow:hidden;border-radius:14px;padding:20px 24px 18px;color:#fff;
    background:linear-gradient(118deg,#0e2a56 0%,#16408a 42%,#4b2ea8 100%);
    box-shadow:0 18px 40px rgba(14,42,86,.22);}
  .hero::before{content:"";position:absolute;right:-60px;top:-120px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(120,170,255,.30),rgba(120,170,255,0) 70%);pointer-events:none;}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
    background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:26px 26px;mask-image:linear-gradient(90deg,transparent,#000);}
  .hero>*{position:relative;z-index:1;}
  .hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .hero h1{font-size:21px;font-weight:700;letter-spacing:.3px;}
  .hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border-radius:20px;padding:3px 11px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(4px);}
  .hero-tag .dot{width:6px;height:6px;border-radius:50%;background:#5fe3a1;box-shadow:0 0 0 3px rgba(95,227,161,.22);}
  .hero-id{font-family:var(--mono);font-size:11px;color:#c5d8f7;background:rgba(255,255,255,.12);
    border-radius:5px;padding:3px 9px;}
  .hero-cost{margin-left:auto;font-size:11.5px;color:#c5d8f7;}
  .hero-cost b{color:#fff;font-weight:600;}
  .hero p{font-size:12.5px;line-height:1.85;color:#dbe7fb;margin-top:12px;max-width:960px;}
  .hero p b{color:#fff;font-weight:600;}
  .hero-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;
    padding-top:14px;border-top:1px solid rgba(255,255,255,.18);}
  .hero-kpi{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:9px 12px;
    transition:background .2s,transform .2s;}
  .hero-kpi:hover{background:rgba(255,255,255,.18);transform:translateY(-2px);}
  .hero-kpi .k{font-size:10.5px;color:#c5d8f7;}
  .hero-kpi .v{font-size:19px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero-kpi .v small{font-size:10.5px;font-weight:400;color:#c5d8f7;font-family:inherit;}

  /* ============ 流程连接条 ============ */
  .sec-conn{display:flex;align-items:center;gap:12px;margin:24px 0 2px;}
  .sec-conn:first-of-type{margin-top:20px;}
  .sec-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#dbe3ef);}
  .sec-line:last-child{background:linear-gradient(90deg,#dbe3ef,transparent);}
  .sec-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:18px;padding:4px 15px 4px 5px;box-shadow:var(--shadow);white-space:nowrap;}
  .sec-chip .no{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;font-family:var(--mono);
    background:linear-gradient(135deg,var(--blue),var(--violet));box-shadow:0 2px 6px rgba(22,104,220,.3);}
  .sec-chip .nm{font-size:13.5px;font-weight:600;letter-spacing:.2px;}
  .sec-chip .extra{font-size:11px;color:var(--faint);border-left:1px solid var(--line);padding-left:9px;}
  .sec-chip .extra b{color:var(--green);font-weight:600;}
  .sec-down{text-align:center;color:#b7c2d2;font-size:11px;margin:3px 0 7px;letter-spacing:2px;line-height:1;}
  .detail>.sec-conn:first-child+.sec-down{display:none;}

  /* ============ 通用卡片 ============ */
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px 20px;box-shadow:var(--shadow);margin-bottom:12px;
    transition:transform .2s,box-shadow .2s,border-color .2s;}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg,var(--blue),var(--violet),var(--teal));}
  .card.tone-violet::before{background:linear-gradient(90deg,var(--violet),#b585f5,var(--blue));}
  .card.tone-teal::before{background:linear-gradient(90deg,var(--teal),#5ed2c0,var(--blue));}
  .card.tone-amber::before{background:linear-gradient(90deg,var(--amber),#f3b55e,var(--rose));}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#cfdcf0;}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .card-title{font-size:14.5px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .card-title .ico{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--blue-bg);color:var(--blue);}
  .card-title .ico svg{width:15px;height:15px;}
  .card-title.violet .ico{background:var(--violet-bg);color:var(--violet);}
  .card-title.teal .ico{background:var(--teal-bg);color:var(--teal);}
  .card-title.amber .ico{background:var(--amber-bg);color:var(--amber);}
  .card-sub{font-size:11.5px;color:var(--faint);}
  .card-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .note{font-size:11.5px;color:var(--muted);line-height:1.75;margin:2px 0 13px;
    background:linear-gradient(90deg,#f6f9ff,rgba(246,249,255,0));border-left:3px solid #c9dcfb;
    padding:7px 12px;border-radius:0 6px 6px 0;}
  .note b{color:var(--blue-d);font-weight:600;}

  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:20px;padding:2px 10px;font-weight:600;flex-shrink:0;}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tag.ok{background:var(--green-bg);color:var(--green);}
  .tag.info{background:var(--blue-bg);color:var(--blue-d);}
  .tag.violet{background:var(--violet-bg);color:#6d3cc4;}
  .tag.amber{background:var(--amber-bg);color:var(--amber);}
  .tag.rose{background:var(--rose-bg);color:var(--rose);}
  .tag.ghost{background:#f1f4f9;color:var(--muted);}
  .tag.ghost::before{display:none;}

  /* ============ 任务信息 ============ */
  .ov-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ov-model{font-size:17px;font-weight:700;letter-spacing:.2px;}
  .ov-specs{display:flex;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
  .ov-cell{flex:1;min-width:130px;padding:0 16px;border-right:1px solid var(--line);}
  .ov-cell:first-child{padding-left:0;}
  .ov-cell:last-child{border-right:none;}
  .ov-cell .k{font-size:11px;color:var(--faint);margin-bottom:3px;}
  .ov-cell .v{font-size:14.5px;font-weight:700;}
  .ov-cell .v small{font-size:10.5px;font-weight:400;color:var(--faint);font-family:inherit;}

  .group-head{display:flex;align-items:center;gap:9px;margin:18px 0 10px;}
  .card>.group-head:first-child{margin-top:8px;}
  .group-head .dot{width:7px;height:7px;border-radius:2px;background:var(--blue);flex-shrink:0;}
  .group-head .t{font-size:12.5px;font-weight:700;white-space:nowrap;}
  .group-head .rule{flex:1;height:1px;background:var(--line-2);}
  .group-head.violet .dot{background:var(--violet);}
  .group-head.teal .dot{background:var(--teal);}
  .group-head.amber .dot{background:var(--amber);}

  /* ============ 字段方格 ============ */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;}
  .stat-grid.tight{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
  .stat{position:relative;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:11px 13px 10px;
    transition:transform .2s,box-shadow .2s,border-color .2s;cursor:help;}
  .stat::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;border-radius:0 2px 2px 0;
    background:var(--blue);opacity:.55;}
  .stat:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(23,36,60,.10);border-color:#c9d9f2;z-index:2;}
  .stat.violet::before{background:var(--violet);}
  .stat.teal::before{background:var(--teal);}
  .stat.amber::before{background:var(--amber);}
  .stat .cn{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .stat .cn .u{font-size:10px;color:var(--faint);font-weight:400;}
  .stat .v{font-size:21px;font-weight:700;line-height:1.35;word-break:break-all;color:var(--ink);}
  .stat .v span.txt{font-size:13px;letter-spacing:0;}
  .stat .d{font-size:10px;color:var(--faint);line-height:1.5;margin-top:5px;
    border-top:1px dashed var(--line);padding-top:5px;}
  .bool{font-family:var(--mono);font-size:12px;font-weight:700;border-radius:5px;padding:2px 9px;}
  .bool.yes{color:var(--green);background:var(--green-bg);border:1px solid #bfe6d2;}
  .bool.no{color:var(--rose);background:var(--rose-bg);border:1px solid #f6cfcb;}
  .null-pill{font-family:var(--mono);font-size:10.5px;color:var(--faint);background:#f1f4f8;
    border:1px solid #e6ebf2;border-radius:5px;padding:2px 8px;}

  /* ============ 采集信息 ============ */
  .hw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
  .hw-group{background:linear-gradient(180deg,#f9fbff,#fff);border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;transition:transform .2s,box-shadow .2s;}
  .hw-group:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(23,36,60,.09);}
  .hw-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .hw-ico{width:27px;height:27px;border-radius:7px;background:var(--teal-bg);color:var(--teal);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hw-ico svg{width:14px;height:14px;}
  .hw-name{font-size:12.5px;font-weight:700;}
  .hw-cnt{font-size:10px;color:var(--faint);margin-left:auto;font-family:var(--mono);}
  .hw-items{display:flex;flex-direction:column;gap:5px;}
  .hw-item{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line-2);
    border-radius:6px;padding:5px 8px;min-width:0;}
  .hw-item .tick{color:var(--green);flex-shrink:0;}
  .hw-item .tick svg{width:12px;height:12px;display:block;}
  .hw-item .cn{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ============ 部署形态横幅 ============ */
  .mode-banner{display:flex;align-items:center;gap:16px;margin-top:16px;padding:14px 18px;border-radius:10px;
    border:1px solid #cfe0ff;background:linear-gradient(100deg,var(--blue-bg) 0%,#f7faff 72%,#fff 100%);}
  .mode-banner.disagg{border-color:#e0d0f8;background:linear-gradient(100deg,var(--violet-bg) 0%,#fbf8ff 72%,#fff 100%);}
  .mb-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .mb-field{font-size:12.5px;font-weight:700;}
  .mb-desc{font-size:11px;color:var(--muted);flex:1;line-height:1.6;}
  .mb-value{font-size:23px;font-weight:800;letter-spacing:.5px;color:var(--blue);white-space:nowrap;}
  .mode-banner.disagg .mb-value{color:var(--violet);}

  /* ============ 并行策略主视觉 ============ */
  .strat-hero{border-radius:12px;padding:16px 18px 18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(125deg,#102a57 0%,#1a3f8f 48%,#4a2ba6 100%);
    box-shadow:0 14px 32px rgba(16,42,87,.20);}
  .strat-hero.disagg{background:linear-gradient(125deg,#2c1a5e 0%,#5a2fa5 52%,#1250a8 100%);}
  .strat-hero::before{content:"";position:absolute;right:-50px;top:-90px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);}
  .strat-hero>*{position:relative;z-index:1;}
  .sh-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px;}
  .sh-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .sh-title svg{width:16px;height:16px;}
  .sh-tag{font-size:10.5px;border-radius:20px;padding:2px 10px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.25);}
  .sh-formula{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:#d7e4ff;}
  .dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
  .dim-card{position:relative;border-radius:11px;padding:14px 12px 13px;text-align:center;overflow:hidden;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.11);
    transition:transform .22s,box-shadow .22s,background .22s;cursor:help;}
  .dim-card::after{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;
    background:rgba(255,255,255,.10);}
  .dim-card:hover{transform:translateY(-4px);background:rgba(255,255,255,.19);
    box-shadow:0 12px 24px rgba(0,0,0,.20);}
  .dim-card .abbr{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1.2px;opacity:.85;}
  .dim-card .v{font-size:36px;font-weight:800;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.18);}
  .dim-card .cn{font-size:11.5px;font-weight:600;}
  .dim-card .d{font-size:9.5px;line-height:1.5;opacity:.82;margin-top:5px;
    border-top:1px solid rgba(255,255,255,.2);padding-top:5px;}
  .sh-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:10.5px;color:#d7e4ff;}
  .sh-foot .chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:2px 10px;}

  /* 卡组拓扑 */
  .topo{margin-top:14px;background:linear-gradient(180deg,#f8faff,#fff);border:1px dashed #cbd9f0;
    border-radius:10px;padding:13px 15px;}
  .topo-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:10px;}
  .topo-head .legend{margin-left:auto;display:flex;gap:12px;font-size:10px;font-weight:400;color:var(--faint);}
  .topo-head .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  .topo-row{display:flex;gap:8px;flex-wrap:wrap;}
  .node-box{background:#fff;border:1px solid #dde7f6;border-radius:8px;padding:7px 9px;transition:box-shadow .2s,transform .2s;}

<script>

/* ==================== 2. 字段字典：英文 key → 中文名 / 单位 / 说明 ==================== */
/* [中文名, 单位, 说明] */
const FIELD = {
  /* 任务与请求 */
  "model":["模型名称","","本次寻优针对的大语言模型标识，决定层数、隐藏维度与 MoE 专家规模"],

const fieldOf = k => {

  if (/^(tp|pp|dp|ep)$/.test(last) && FIELD["parallel." + last]) return FIELD["parallel." + last];
  return FIELD[last] || ["", "", ""];
};

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const fmt = n => (typeof n === "number" && isFinite(n))
  ? n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : esc(n);
const valHtml = v => {
  if (v === null || v === undefined) return '<span class="null-pill">无数据</span>';
  if (v === true)  return '<span class="bool yes">满足</span>';
  if (v === false) return '<span class="bool no">未满足</span>';
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : fmt(v);
  const s = esc(v);
  return `<span class="${String(v).length>16?"txt":""}">${s}</span>`;
};
const flat = (obj,prefix="") => Object.entries(obj||{}).flatMap(([k,v]) =>
  isObj(v) ? flat(v,prefix+k+".") : [[prefix+k,v]]);
const pick = (pairs,keys) => keys.map(k=>pairs.find(([n])=>n===k)).filter(Boolean);
const timeText = s => s ? String(s).replace("T"," ").replace(/\+08:00/,"") : "—";
function durationText(a,b){
  const d = new Date(b) - new Date(a);
  if (!isFinite(d) || d < 0) return "—";
  const m = Math.floor(d/60000), s = Math.round((d%60000)/1000);
  return m>0 ? `${m} 分 ${s} 秒` : `${s} 秒`;
}

/* ==================== 6. 数据解析（单份响应 → 单一部署形态） ==================== */
function readOptimize(resp){
  const node = resp && resp.common && resp.common.infer_strategy_npu;
  if (!node) return { ok:false, reason:"响应缺少 common.infer_strategy_npu 节点" };
  const d = node.data || {}, result = d.result || {};
  const agg = (result.agg && Array.isArray(result.agg.candidates)) ? result.agg.candidates : [];
  const dis = (result.disagg && Array.isArray(result.disagg.candidates)) ? result.disagg.candidates : [];
  /* 真实任务只会返回一种形态；此处按实际存在候选集的一侧判定 */
  const mode = agg.length ? "agg" : (dis.length ? "disagg" : null);
  const candidate = mode === "agg" ? agg[0] : (mode === "disagg" ? dis[0] : null);
  return {
    ok: !!candidate, mode, candidate, request: d.request || {},
    times: { created:d.created_at, started:d.started_at, finished:d.finished_at },
    status: { code:node.code, status:node.status, message:node.message },
    count: mode === "agg" ? agg.length : dis.length,
    reason: "寻优响应中 agg / disagg 均无 candidates"
  };
}
function readSimulate(resp){
  const node = resp && resp.common && resp.common.infer_simulate;
  if (!node || !node.data) return { ok:false, reason:"响应缺少 common.infer_simulate.data 节点" };
  const d = node.data;
  return { ok:true, data:d, status:{ code:node.code, status:node.status, message:node.message } };
}

        <span class="chip">张量并行：层内切分</span><span class="chip">流水并行：按层切段</span>
        <span class="chip">数据并行：副本分流</span><span class="chip">专家并行：MoE 分片</span>
      </div>
    </div>
    ${topoHtml(ctx)}
    ${groupHead("运行配置","violet")}
    ${grid(cfg,"violet")}
    ${groupHead("性能指标","violet")}
    ${grid(perf,"violet")}
    ${rest.length?groupHead("其他返回字段","violet")+grid(rest,"violet"):""}
  </div>`;
}

function strategyDisaggHtml(ctx){
  const c = ctx.opt.candidate, pf = c.prefill||{}, dc = c.decode||{};
  const parKeys = ["parallel.tp","parallel.pp","parallel.dp","parallel.ep"];
  const cfgKeys = ["instances","devices_per_instance","devices_total","batch_size","concurrency"];
  const perfKeys = ["ttft_ms","tpot_ms","tokens_per_s_per_instance","tokens_per_s_per_device","tokens_per_s_cluster"];
  const side = (name,obj,badge,tone,sideCls) => {
    const pairs = flat(obj).map(([k,val])=>[name+"."+k,val]);
    /* 用带前缀的键渲染，但字典按末段匹配，需临时还原 */
    const render = (keys,fn) => keys.map(k=>{
      const p = pairs.find(([n])=>n===name+"."+k);
      return p ? fn(k,p[1]) : "";
    }).join("");
    return `<div class="sub ${sideCls}">
      <div class="sub-head"><span class="badge ${badge}">${esc(name)}</span>
        <span class="tag ghost">${esc(obj.devices_total||0)} 卡 / ${esc(obj.instances||0)} 实例</span></div>
      ${groupHead("并行策略",tone)}
      <div class="dim-grid">${render(parKeys,(k,val)=>{
        mark("parallel."+k.split(".").pop());
        const f = fieldOf("parallel."+k.split(".").pop());
        return `<div class="dim-card" title="${esc(f[2]||"")}"><div class="abbr">${esc(k.split(".").pop().toUpperCase())}</div>
          <div class="v">${valHtml(val)}</div><div class="cn">${esc(f[0]||k)}</div></div>`;
      })}</div>
      ${groupHead("实例配置",tone)}
      <div class="stat-grid">${render(cfgKeys,(k,val)=>stat([k,val],tone,false))}</div>
    </div>`;
  };
  /* 性能对比表：中文行名 + 说明 */
  const rows = perfKeys.map(k=>{
    mark(k);
    const f = fieldOf(k);
    const a = pf[k], b = dc[k];
    return `<tr><td class="k">${esc(f[0]||k)}</td>
      <td class="num">${valHtml(a)}</td><td class="num">${valHtml(b)}</td>
      <td class="desc">${esc(f[2]||"")}${f[1]?` · 单位 ${esc(f[1])}`:""}</td></tr>`;
  }).join("");
  const restPf = flat(pf).filter(([k])=>!parKeys.includes(k)&&!cfgKeys.includes(k)&&!perfKeys.includes(k));
  return `<div class="card tone-violet">
    ${cardHead("最优部署策略","PD 分离 · Prefill / Decode 独立实例组",
      `<span class="tag violet">候选 ${esc(ctx.opt.count)} 条</span>
       <span class="tag info">P ${esc(pf.devices_total||0)} 卡 / D ${esc(dc.devices_total||0)} 卡</span>`,"violet")}
    <div class="strat-hero disagg">
      <div class="sh-head"><span class="sh-title">${icon("split")} 双阶段并行部署策略</span>
        <span class="sh-tag">最优候选 #1</span>
        <span class="sh-formula">P: TP${esc(pf.parallel&&pf.parallel.tp)}·DP${esc(pf.parallel&&pf.parallel.dp)}
          / D: TP${esc(dc.parallel&&dc.parallel.tp)}·DP${esc(dc.parallel&&dc.parallel.dp)}</span></div>
      <div class="sub-grid">
        ${side("prefill",pf,"p","", "p-side")}
        ${side("decode",dc,"d","violet","d-side")}
      </div>
    </div>
    ${topoHtml(ctx)}
    ${groupHead("阶段性能指标对比","violet")}
    <div class="table-wrap"><table class="kv">
      <thead><tr><th>指标名称</th><th>Prefill 阶段</th><th>Decode 阶段</th><th>指标说明</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${restPf.length?groupHead("其他返回字段","violet")+grid(restPf,"violet"):""}
  </div>`;
}

function simulateHtml(ctx){
  const d = ctx.sim.data, tp = flat(d.throughput);
  const scaleKeys = ["requests","input_tokens","generated_tokens","latency"];
  const tputKeys = ["prompt_throughput","generation_throughput","total_throughput"];
  const scale = pick(tp,scaleKeys), tput = pick(tp,tputKeys);
  const rest = tp.filter(([k])=>!scaleKeys.includes(k)&&!tputKeys.includes(k));
  const latencyKeys = ["ttft","tpot","itl"];
  const cols = ["mean","median","p99"];
  latencyKeys.forEach(k=>mark(k));
  cols.forEach(k=>mark(k));

  const p = v => Number(v)||0;
  const total = p(d.throughput.total_throughput);
  const pp = p(d.throughput.prompt_throughput), gp = p(d.throughput.generation_throughput);
  const w1 = total? (pp/total*100):0, w2 = total? (gp/total*100):0;

  /* 时延分位分组柱状图 */
  const W=460,H=196,padL=38,padR=10,padT=18,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const maxV = Math.max(...latencyKeys.flatMap(k=>cols.map(c=>Number(d[k]&&d[k][c])||0)),1)*1.18;
  const ticks = [0,1,2,3,4].map(i=>maxV*i/4);
  const gridSvg = ticks.map(t=>{
    const y = padT+plotH*(1-t/maxV);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${t===0?"#c9d2de":"#eef1f5"}" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3.5}" text-anchor="end" font-size="9" fill="#8b96a8" font-family="Consolas,monospace">${Math.round(t)}</text>`;
  }).join("");
  const colors = ["#1668dc","#7c3aed","#0d9488"];
  const groupW = plotW/latencyKeys.length, barW=20, gap=5;
  let bars = "";
  latencyKeys.forEach((k,gi)=>{
    const cx = padL+groupW*gi+groupW/2;
    cols.forEach((c,ci)=>{
      const v = Number(d[k]&&d[k][c])||0;
      const h = plotH*(v/maxV), x = cx-(barW*3+gap*2)/2+ci*(barW+gap), y = padT+plotH-h;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(0,h)}" rx="3" fill="${colors[ci]}" opacity="${0.55+ci*0.2}"/>
        <text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="${colors[ci]}">${Math.round(v)}</text>`;
    });
    bars += `<text x="${cx}" y="${H-11}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">${esc(fieldOf(k)[0]||k)}</text>`;
  });

  const tableRows = latencyKeys.map(k=>{
    const f = fieldOf(k);
    return `<tr><td class="k">${esc(f[0]||k)}</td>
      ${cols.map(c=>`<td class="num">${valHtml(d[k]?d[k][c]:null)}</td>`).join("")}
      <td class="desc">${esc(f[2]||"")}</td></tr>`;
  }).join("");

  return `<div class="card tone-teal">
    ${cardHead("仿真结果总览","PD 混部 / PD 分离下游输出格式统一",
      `<span class="tag ok">仿真成功</span><span class="tag ghost">${esc(ctx.sim.status.message||"")}</span>`,"teal")}
    <div class="note"><b>统一格式：</b>无论上游是 PD 混部还是 PD 分离，仿真阶段均输出相同的
      <b>吞吐、首 Token 时延、每 Token 生成时延、Token 间时延</b> 四组指标，便于跨形态横向对比。
      下图为吞吐构成与时延分位统计，数值均取自接口原始返回。</div>
    ${groupHead("请求与规模","teal")}
    ${grid(scale,"teal")}
    ${groupHead("吞吐指标","teal")}
    ${grid(tput,"teal")}
    <div class="chart-grid" style="margin-top:13px">
      <div class="chart-card">
        <div class="chart-head"><span class="chart-title">吞吐构成</span></div>
        <div class="chart-sub">Prefill 输入吞吐 + Decode 生成吞吐 = 总吞吐（${esc(fmt(total))} tokens/s）</div>
        <div class="tput-bar"><div class="seg1" style="width:${w1.toFixed(1)}%"></div><div class="seg2" style="width:${w2.toFixed(1)}%"></div></div>
        <div class="tput-bar-legend">
          <span class="tput-item"><i class="lg-dot" style="background:#1668dc"></i>Prefill <b>${esc(fmt(pp))}</b> · ${w1.toFixed(1)}%</span>
          <span class="tput-item"><i class="lg-dot" style="background:#0d9488"></i>Decode <b>${esc(fmt(gp))}</b> · ${w2.toFixed(1)}%</span>
        </div>
        <div class="chart-sub" style="margin-top:10px;margin-bottom:0">条形按总吞吐归一化，直观呈现输入处理与输出生成在吞吐中的占比。</div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><span class="chart-title">时延分位对比</span></div>
        <div class="chart-sub">TTFT / TPOT / ITL 的平均值、中位数与 P99（单位 ms）</div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="时延分位柱状图">${gridSvg}${bars}</svg>
        <div class="legend-row">
          ${cols.map((c,i)=>`<span><i class="lg-dot" style="background:${colors[i]}"></i>${esc(fieldOf(c)[0]||c)}</span>`).join("")}
        </div>
      </div>
    </div>
    ${groupHead("时延分位明细","teal")}
    <div class="table-wrap"><table class="kv">
      <thead><tr><th>指标名称</th>${cols.map(c=>`<th>${esc(fieldOf(c)[0]||c)}</th>`).join("")}<th style="text-align:left">指标说明</th></tr></thead>
      <tbody>${tableRows}</tbody></table></div>
    ${rest.length?groupHead("其他仿真字段","teal")+grid(rest,"teal"):""}
  </div>`;
}

const SEARCH_STEPS = [
  ["集群信息预采集","一次性采集节点内 / 跨节点带宽时延、CPU 与 NPU 容量，多任务复用"],
  ["部署形态判定","按任务下发的服务化配置，确定 PD 混部或 PD 分离搜索空间"],
  ["并行策略空间展开","TP × PP × DP × EP 四维组合，结合实例数与单实例卡数联合枚举"],
  ["SLO 约束剪枝","以 TTFT / TPOT 上限筛除超时组合，剔除显存与整除性不可行方案"],
  ["最优候选输出","输出满足约束且吞吐最优的候选策略及其运行配置、性能指标"]
];
const SIM_STEPS = [
  ["接收候选策略","读取寻优阶段输出的最优并行配置作为仿真输入"],
  ["请求负载构造","按输入 / 输出序列长度与并发数构造仿真请求"],
  ["阶段代价建模","Prefill 计算密集、Decode 访存密集，分别建模执行与通信开销"],
  ["分位统计","对 TTFT / TPOT / ITL 采样，输出平均值、中位数与 P99"],
  ["统一格式落盘","输出 throughput / ttft / tpot / itl 四组字段，跨形态口径一致"]
];
function principlesHtml(){
  const panel = (cls,badge,title,sub,steps,chips) => {
    const step = (s,i) => `<div class="pr-step"><div class="pr-step-rail">
      <span class="pr-num ${cls}">${i+1}</span>${i===steps.length-1?"":'<span class="pr-rail"></span>'}</div>
      <div class="pr-step-body"><div class="n">${esc(s[0])}</div><div class="d">${esc(s[1])}</div></div></div>`;
    return `<div class="pr-panel"><div class="pr-head"><span class="pr-badge ${cls}">${icon(badge)}</span>
      <div><div class="pr-title">${esc(title)}</div><div class="pr-sub">${esc(sub)}</div></div></div>
      ${steps.map(step).join("")}
      <div class="pr-chips"><span class="lb">技术要点：</span>${chips.map(c=>`<span class="pr-chip ${cls}">${esc(c)}</span>`).join("")}</div></div>`;
  };
  return `<div class="pr-grid">
    ${panel("a","search","推理寻优工具原理","基于预采集实测数据，在并行策略空间中搜索满足 SLO 的部署方案",SEARCH_STEPS,
      ["四维并行空间","SLO 约束剪枝","PD 混部 / 分离","实例数联合枚举"])}
    ${panel("b","waves","推理仿真工具原理","解析式代价模型预估性能，不跑真实推理即可验证策略",SIM_STEPS,
      ["分阶段代价模型","分位统计","P99 长尾","统一输出格式"])}
  </div>`;
}

function dictHtml(ctx){
  const rows = USED.map(k=>{
    const f = fieldOf(k);
    return `<tr><td class="k">${esc(f[0]||k)}</td>
      <td class="num">${esc(f[1]||"—")}</td>
      <td class="desc">${esc(f[2]||"暂无说明")}</td>
      <td class="desc">${hasDict(k)?'<span style="color:#0f9d58">已收录</span>':'<span style="color:#d97706">待补充</span>'}</td></tr>`;
  }).join("");
  return `<details class="fold"><summary><span class="ico">${icon("book")}</span>指标释义 · 中文名称与含义
    <span class="sub">共 ${USED.length} 项指标，含中文名、单位与含义说明</span></summary>
    <div class="fold-body"><div class="note"><b>说明口径：</b>页面所有可见标签均使用中文表述，悬浮任意指标卡可查看说明；
      新增指标会自动收录到本表，不会遗漏。</div>
      <div class="table-wrap"><table class="kv">
        <thead><tr><th>指标名称</th><th>单位</th><th style="text-align:left">含义说明</th><th style="text-align:left">状态</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div></details>`;
}
function rawHtml(optResp,simResp){
  return `<details class="fold"><summary><span class="ico">${icon("code")}</span>原始接口响应
    <span class="sub">寻优 + 仿真两份 JSON，便于核对字段与取值</span></summary>
    <div class="fold-body">
      <div class="tool-row"><button class="btn" type="button" id="copyBtn">${icon("copy")} 复制 JSON</button>
        <span class="card-sub">真实接入时，将 window.INFER_OPT_RESULT / window.INFER_SIM_RESULT 替换为接口返回值即可。</span></div>
      <pre class="raw-pre" id="rawPre">${esc(JSON.stringify({infer_strategy_npu:optResp,infer_simulate:simResp},null,2))}</pre>
    </div></details>`;
}

/* ==================== 9. 页面组装 ==================== */
function modeBadgeHtml(mode){
  const label = mode === "agg" ? "PD 混部" : (mode === "disagg" ? "PD 分离" : "形态未知");
  return `<span class="mode-badge ${mode==="disagg"?"disagg":""}">
    <span class="mb-ico">${icon(mode==="disagg"?"split":"chip")}</span>
    <span>当前部署形态 · ${esc(label)}</span>
    <span class="mb-hint">由结果数据自动识别</span></span>`;
}
function footerHtml(current){
  const btn = (m,label) => `<button type="button" class="demo-btn ${current===m?"active":""}" data-demo="${m}">${esc(label)}</button>`;
  return `<div class="footer">
    <div class="demo"><span class="lb">演示数据（默认 PD 分离 · 仅用于预览两种响应格式）</span>
      ${btn("disagg","PD 分离示例")}${btn("agg","PD 混部示例")}</div>
    <span class="spacer"></span>
    <span>真实接入：<code>window.INFER_OPT_RESULT</code> / <code>window.INFER_SIM_RESULT</code>
      或调用 <code>window.renderInferReport(opt, sim)</code>，一次任务只呈现一种形态</span>
    <button class="btn primary" type="button" id="printBtn">${icon("print")} 打印报告</button>
  </div>`;
}

function render(optResp,simResp,currentDemo){
  USED = [];
  const opt = readOptimize(optResp), sim = readSimulate(simResp);
  if (!opt.ok || !sim.ok){
    document.getElementById("detailArea").innerHTML =
      `<div class="card"><div class="empty"><b>数据解析失败</b>
        ${esc(!opt.ok?("寻优响应："+opt.reason):"")} ${esc(!sim.ok?("仿真响应："+sim.reason):"")}
        <br>请检查 <code>common.infer_strategy_npu</code> 与 <code>common.infer_simulate</code> 节点。</div></div>`;
    document.getElementById("modeBadge").innerHTML = modeBadgeHtml(null);
    document.getElementById("hero").innerHTML = "";
    document.getElementById("footer").innerHTML = footerHtml(currentDemo);
    bindFooter(currentDemo);
    return;
  }
  const ctx = { opt, sim, mode:opt.mode };
  document.getElementById("modeBadge").innerHTML = modeBadgeHtml(opt.mode);
  document.getElementById("hero").innerHTML = heroHtml(ctx);
  document.getElementById("detailArea").innerHTML =
    secConn("01","任务信息",`响应码 <b>${esc(opt.status.code)}</b>`) +
    overviewHtml(ctx) +
    secConn("02","采集信息",`${COLLECT.reduce((s,g)=>s+g[1].length,0)} 项 · <b>已采集</b>`) +
    collectHtml() +
    secConn("03","寻优策略",`${esc(opt.mode==="agg"?"PD 混部":"PD 分离")} · <b>候选 ${esc(opt.count)} 条</b>`) +
    (opt.mode === "agg" ? strategyAggHtml(ctx) : strategyDisaggHtml(ctx)) +
    secConn("04","仿真结果","<b>格式统一</b> · 吞吐 / TTFT / TPOT / ITL") +
    simulateHtml(ctx) +
    secConn("05","工具基本原理","寻优 + 仿真 双链路") +
    principlesHtml() +
    secConn("06","字段说明与原始数据","指标释义 / 原始 JSON") +
    dictHtml(ctx) + rawHtml(optResp,simResp);
  document.getElementById("footer").innerHTML = footerHtml(currentDemo);
  bindFooter(currentDemo);
  bindTools(optResp,simResp);
}

function bindFooter(currentDemo){
  document.querySelectorAll("[data-demo]").forEach(b=>{
    b.addEventListener("click",()=>render(DEMO_OPT[b.dataset.demo],DEMO_SIM,b.dataset.demo));
  });
}
function bindTools(optResp,simResp){
  const printBtn = document.getElementById("printBtn");
  if(printBtn) printBtn.addEventListener("click",()=>window.print());
  const copyBtn = document.getElementById("copyBtn");
  if(copyBtn) copyBtn.addEventListener("click",async()=>{
    const text = JSON.stringify({infer_strategy_npu:optResp,infer_simulate:simResp},null,2);
    try{ await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(_){}
      document.body.removeChild(ta);
    }
    copyBtn.innerHTML = icon("check")+" 已复制";
    setTimeout(()=>{ copyBtn.innerHTML = icon("copy")+" 复制 JSON"; },1600);
  });
}

/* ==================== 10. 初始化 ==================== */
document.getElementById("logoIcon").innerHTML = icon("logo");
document.getElementById("sideMenu").innerHTML = [
  ["grid","集群总览",true],["target","调优工作台",false],["pulse","监控诊断中心",false],
  ["chip","模型调优",false],["doc","文档中心",false]
].map(([ico,name,arrow])=>`<div class="menu-item${name==="模型调优"?" active":""}">${icon(ico)}${esc(name)}${arrow?'<span class="arrow">▸</span>':""}</div>`).join("");

/* 默认优先展示 PD 分离；?demo=agg 可显式切到 PD 混部 */
const initialDemo = new URLSearchParams(location.search).get("demo") === "agg" ? "agg" : "disagg";
const injectedOpt = window.INFER_OPT_RESULT, injectedSim = window.INFER_SIM_RESULT;
window.renderInferReport = (o,s) => render(o,s,"custom");
render(injectedOpt || DEMO_OPT[initialDemo], injectedSim || DEMO_SIM, injectedOpt ? "custom" : initialDemo);
</script>
