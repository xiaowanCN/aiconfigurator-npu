<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智算调优平台 · 推理策略寻优与仿真结果（报错版 · 仿真失败）</title>
<style>
  :root{
    --sidebar-bg:#0a1f3c; --primary:#1668dc; --primary-dark:#0e56c0; --primary-2:#3d8bfd;
    --bg:#f2f4f8; --card:#fff; --border:#e6eaf1;
    --text:#1c2532; --text-2:#55637a; --text-3:#8b96a8;
    --green:#0f9d58; --green-bg:#e6f6ec;
    --red:#e1463e; --red-bg:#fdecea; --red-line:#f5cdc9;
    --orange:#e8890c; --orange-bg:#fdf3e3; --orange-line:#f3ddb5;
    --blue-bg:#e9f1fe; --blue-line:#cfe0ff;
    --violet:#7c3aed; --violet-bg:#f3edfc; --violet-line:#ddd0f5;
    --teal:#0d9488; --teal-bg:#e6f6f3;
    --radius:10px; --shadow:0 1px 3px rgba(28,37,50,.05);
    --shadow-hover:0 12px 28px rgba(28,37,50,.11);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;}
  body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue","Segoe UI",Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}
  .num,.ov-cell .v,.err-code,.msg-pre,.mini-stat .v,.tl-time,.stat .v,.dim-card .v,.kv td.num{
    font-family:var(--mono);font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9d2de;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* 平台外壳 */
  .layout{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:214px;flex-shrink:0;display:flex;flex-direction:column;color:#c6d3e2;
    background:linear-gradient(180deg,#0a1f3c 0%,#0c2547 100%);}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
  .logo-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:#fff;background:linear-gradient(135deg,#3d8bfd,#1250b5);box-shadow:0 2px 8px rgba(22,104,220,.45);}
  .logo-icon svg{width:19px;height:19px;}
  .logo-name{font-size:15px;font-weight:600;color:#fff;line-height:1.25;}
  .logo-sub{font-size:10px;color:#6f8cab;letter-spacing:.4px;}
  .menu{flex:1;padding:12px 10px;}
  .menu-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;
    font-size:13.5px;margin-bottom:4px;color:#a9bcd4;position:relative;transition:all .18s;}
  .menu-item svg{width:16px;height:16px;flex-shrink:0;}
  .menu-item:hover{background:#14304c;color:#e6eef7;}
  .menu-item.active{background:linear-gradient(90deg,rgba(61,139,253,.22),rgba(61,139,253,.08));color:#fff;font-weight:500;}
  .menu-item.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;
    border-radius:0 3px 3px 0;background:#3d8bfd;}
  .menu-item .arrow{margin-left:auto;font-size:10px;color:#5f7ea3;}
  .space-bar{padding:13px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;}
  .space-dot{width:8px;height:8px;border-radius:50%;background:#2fbf71;flex-shrink:0;box-shadow:0 0 6px rgba(47,191,113,.8);}
  .space-name{font-size:12px;color:#c6d3e2;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .space-btn{background:#24466e;color:#dce7f2;border:none;border-radius:5px;font-size:11px;padding:3px 10px;cursor:pointer;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:50px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;
    padding:0 18px;gap:12px;flex-shrink:0;}
  .btn-back{display:flex;align-items:center;gap:6px;background:var(--blue-bg);color:var(--primary);border:none;
    border-radius:17px;padding:6px 15px;font-size:13px;cursor:pointer;}
  .btn-back:hover{background:#d9e8fd;}
  .crumb{font-size:13px;color:var(--text-3);}
  .crumb b{color:var(--text);font-weight:500;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2);}
  .avatar{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#4d8ef7,#1668dc);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;}
  .mode-badge{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:4px 12px 4px 6px;
    font-size:12px;font-weight:600;border:1px solid var(--violet-line);background:var(--violet-bg);color:#6d3cc4;}
  .mode-badge .mb-ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#a273f2,#6d3cc4);color:#fff;}
  .mode-badge .mb-ico svg{width:12px;height:12px;}
  .mode-badge .mb-hint{font-size:10.5px;font-weight:400;opacity:.8;border-left:1px solid currentColor;padding-left:8px;}
  .content{flex:1;overflow-y:auto;padding:20px 26px 40px;}
  .content-inner{max-width:1240px;margin:0 auto;}

  /* 章节导航与标题 */
  .section-nav{display:flex;align-items:center;gap:5px;padding:6px;margin-bottom:18px;
    border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--shadow);overflow-x:auto;}
  .section-nav a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;
    border-radius:7px;color:var(--text-2);font-size:12px;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s;}
  .section-nav a span{font:11px var(--mono);color:#97a6bc;}
  .section-nav a:hover,.section-nav a:focus-visible{background:#edf4ff;color:var(--primary);}
  .section-nav a:focus-visible{outline:2px solid #91baff;outline-offset:-2px;}
  .sec-conn{display:flex;align-items:center;gap:12px;min-height:46px;margin:25px 0 10px;scroll-margin-top:18px;}
  .sec-conn:first-of-type{margin-top:2px;}
  .sec-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex-shrink:0;
    border:1px solid #d9e6f8;border-radius:10px;color:var(--primary);
    background:linear-gradient(145deg,#fff 0%,#eaf2ff 100%);box-shadow:0 2px 5px rgba(22,104,220,.04);}
  .sec-icon svg{width:19px;height:19px;}
  .sec-conn.failed .sec-icon{border-color:var(--red-line);color:var(--red);
    background:linear-gradient(145deg,#fff,#fdecea);}
  .sec-heading{margin:0;font-size:16px;font-weight:600;line-height:1.4;letter-spacing:.4px;color:#24344b;}
  .sec-rule{flex:1;min-width:12px;height:1px;margin-left:8px;background:linear-gradient(90deg,#dbe2ed,rgba(219,226,237,.25));}
  .sec-extra{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid #dcece5;
    border-radius:6px;background:#f4faf7;font-size:11px;color:var(--text-2);white-space:nowrap;}
  .sec-extra b{color:#16815a;font-weight:500;}
  .sec-extra.bad{border-color:var(--red-line);background:var(--red-bg);color:var(--red);}
  .sec-extra.bad b{color:var(--red);}
  .sec-extra.warnx{border-color:var(--orange-line);background:var(--orange-bg);color:var(--orange);}
  .sec-extra.warnx b{color:var(--orange);}
  .sec-index{padding-left:12px;border-left:1px solid #dce3ee;color:#9aa8bc;font:500 12px/1 var(--mono);letter-spacing:1px;}

  /* 首部与横幅 */
  .hero{position:relative;overflow:hidden;border:1px solid #f2dfc2;border-radius:12px;padding:18px 22px 17px;
    background:linear-gradient(110deg,#fff9f0 0%,#fff 70%);box-shadow:0 2px 10px rgba(232,137,12,.05);}
  .hero::before{content:"";position:absolute;right:-70px;top:-130px;width:360px;height:360px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,137,12,.08),rgba(232,137,12,0) 70%);pointer-events:none;}
  .hero>*{position:relative;z-index:1;}
  .hero-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
  .hero h1{font-size:21px;font-weight:700;letter-spacing:.3px;color:#1c2532;}
  .hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border-radius:20px;padding:3px 11px;
    background:var(--orange-bg);border:1px solid var(--orange-line);color:var(--orange);}
  .hero-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(232,137,12,.14);}
  .hero p{font-size:13px;line-height:1.8;color:var(--text-2);margin-top:9px;max-width:980px;}
  .hero p b{color:var(--orange);font-weight:600;}
  .alert-strip{display:flex;align-items:center;gap:13px;margin:16px 0 0;padding:13px 18px;border-radius:11px;
    border:1px solid var(--red-line);background:linear-gradient(100deg,#fdecea,#fff 78%);}
  .alert-ico{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--red);color:#fff;}
  .alert-ico svg{width:18px;height:18px;}
  .alert-body{min-width:0;flex:1;}
  .alert-body b{font-size:13.5px;font-weight:700;color:var(--text);}
  .alert-body p{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.65;}
  .alert-code{font:700 12px/1 var(--mono);color:var(--red);border:1px solid var(--red-line);
    background:#fff;border-radius:6px;padding:6px 10px;white-space:nowrap;}

  /* 阶段状态条 */
  .pipeline{display:flex;align-items:stretch;gap:0;margin:16px 0 2px;padding:14px 18px;
    border:1px solid var(--border);border-radius:11px;background:#fff;box-shadow:var(--shadow);overflow-x:auto;}
  .pl-item{display:flex;align-items:center;gap:9px;flex:1;min-width:150px;}
  .pl-ico{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;background:var(--green-bg);color:var(--green);border:1px solid #bfe6d2;}
  .pl-ico svg{width:15px;height:15px;}
  .pl-item.failed .pl-ico{background:var(--red-bg);color:var(--red);border-color:var(--red-line);}
  .pl-txt b{display:block;font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;}
  .pl-txt small{font-size:10.5px;color:var(--text-3);white-space:nowrap;}
  .pl-item.failed .pl-txt b{color:var(--red);}
  .pl-line{flex:0 0 34px;height:2px;align-self:center;margin:0 8px;background:#dfe7f0;border-radius:2px;}
  .pl-line.broken{background:repeating-linear-gradient(90deg,#f0c3bf 0 5px,transparent 5px 10px);}

  /* 通用卡片 */
  .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px 18px;box-shadow:var(--shadow);margin-bottom:12px;transition:transform .2s,box-shadow .2s,border-color .2s;}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg,#9dc3f5,#e6eaf1);}
  .card.tone-violet::before{background:linear-gradient(90deg,#c9b0f2,#e6eaf1);}
  .card.tone-teal::before{background:linear-gradient(90deg,#9bd9cd,#e6eaf1);}
  .card.tone-red::before{background:linear-gradient(90deg,#f0a9a4,#e6eaf1);}
  .card.tone-orange::before{background:linear-gradient(90deg,#f0c079,#e6eaf1);}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#d6e0ee;}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .card-title{font-size:14.5px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .card-title .ico{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--blue-bg);color:var(--primary);}
  .card-title .ico svg{width:15px;height:15px;}
  .card-title.violet .ico{background:var(--violet-bg);color:var(--violet);}
  .card-title.teal .ico{background:var(--teal-bg);color:var(--teal);}
  .card-title.red .ico{background:var(--red-bg);color:var(--red);}
  .card-title.orange .ico{background:var(--orange-bg);color:var(--orange);}
  .card-sub{font-size:11.5px;color:var(--text-3);}
  .card-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:20px;padding:2px 10px;font-weight:600;flex-shrink:0;}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tag.ok{background:var(--green-bg);color:var(--green);}
  .tag.info{background:var(--blue-bg);color:var(--primary-dark);}
  .tag.violet{background:var(--violet-bg);color:#6d3cc4;}
  .tag.red{background:var(--red-bg);color:var(--red);}
  .tag.orange{background:var(--orange-bg);color:var(--orange);}
  .tag.ghost{background:#f1f4f9;color:var(--text-2);}
  .tag.ghost::before{display:none;}
  .note{font-size:11.5px;color:var(--text-2);line-height:1.75;margin:2px 0 13px;
    background:linear-gradient(90deg,#f6f9ff,rgba(246,249,255,0));border-left:3px solid #c9dcfb;
    padding:7px 12px;border-radius:0 6px 6px 0;}
  .note b{color:var(--primary-dark);font-weight:600;}
  .note.red{background:linear-gradient(90deg,#fff6f5,rgba(255,246,245,0));border-left-color:#f0a9a4;}
  .note.red b{color:var(--red);}
  .note.orange{background:linear-gradient(90deg,#fffaf2,rgba(255,250,242,0));border-left-color:#f0c079;}
  .note.orange b{color:var(--orange);}
  .group-head{display:flex;align-items:center;gap:9px;margin:18px 0 10px;}
  .group-head .dot{width:7px;height:7px;border-radius:2px;background:var(--primary);flex-shrink:0;}
  .group-head.violet .dot{background:var(--violet);}
  .group-head.teal .dot{background:var(--teal);}
  .group-head.red .dot{background:var(--red);}
  .group-head .t{font-size:12.5px;font-weight:700;white-space:nowrap;}
  .group-head .rule{flex:1;height:1px;background:#eef1f6;}

  /* 任务信息 */
  .ov-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ov-model{font-size:16px;font-weight:600;letter-spacing:.2px;}
  .ov-id{font-family:var(--mono);font-size:11px;color:var(--text-3);background:#f0f3f7;border-radius:4px;padding:2px 8px;}
  .ov-cost{margin-left:auto;font-size:12px;color:var(--text-3);}
  .ov-cost b{color:var(--text-2);font-weight:500;}
  .ov-specs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:13px;padding-top:12px;border-top:1px solid var(--border);}
  .ov-cell{padding:0 16px 12px;border-right:1px solid var(--border);min-width:0;}
  .ov-cell:nth-child(4n){border-right:none;}
  .ov-cell:nth-child(n+5){padding-top:12px;border-top:1px solid var(--border);}
  .ov-cell:nth-child(1){padding-left:0;}
  .ov-cell .k{font-size:11.5px;color:var(--text-3);margin-bottom:4px;}
  .ov-cell .v{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ov-cell .v small{font-size:11px;font-weight:400;color:var(--text-3);font-family:inherit;}
  .mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;padding-top:13px;
    border-top:1px dashed var(--orange-line);}
  .mini-stat{background:#fffaf3;border:1px solid #f3e2c6;border-radius:8px;padding:9px 11px;}
  .mini-stat.good{background:#f5fbf7;border-color:#cfeadb;}
  .mini-stat .k{font-size:10.5px;color:var(--text-3);}
  .mini-stat .v{font-size:13px;font-weight:700;color:var(--text);line-height:1.5;}
  .mini-stat .v.bad{color:var(--red);}
  .mini-stat .v.ok{color:var(--green);}

  /* 采集信息 */
  .hw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
  .hw-group{background:linear-gradient(180deg,#f9fbff,#fff);border:1px solid var(--border);border-radius:10px;
    padding:12px 13px;transition:transform .2s,box-shadow .2s;}
  .hw-group:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(28,37,50,.09);}
  .hw-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .hw-ico{width:27px;height:27px;border-radius:7px;background:var(--teal-bg);color:var(--teal);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hw-ico svg{width:14px;height:14px;}
  .hw-name{font-size:12.5px;font-weight:700;}
  .hw-cnt{font-size:10px;color:var(--text-3);margin-left:auto;font-family:var(--mono);}
  .hw-items{display:flex;flex-direction:column;gap:5px;}
  .hw-item{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #eef2f8;
    border-radius:6px;padding:5px 8px;min-width:0;}
  .hw-item .tick{color:var(--green);flex-shrink:0;}
  .hw-item .tick svg{width:12px;height:12px;display:block;}
  .hw-item .cn{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 03 正常策略卡 */
  .strat-hero{position:relative;border:1.5px solid #d5c2f3;border-radius:12px;padding:16px 18px 18px;
    background:linear-gradient(160deg,#fbf8ff,#fff 70%);box-shadow:0 2px 10px rgba(124,58,237,.05);}
  .strat-hero>*{position:relative;z-index:1;}
  .sh-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px;}
  .sh-title{font-size:14px;font-weight:700;color:#24518d;display:flex;align-items:center;gap:8px;}
  .sh-title svg{width:16px;height:16px;}
  .sh-tag{font-size:10.5px;border-radius:20px;padding:2px 10px;background:var(--violet-bg);
    border:1px solid var(--violet-line);color:#6d3cc4;}
  .sh-formula{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-2);}
  .dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
  .dim-card{position:relative;border:1.5px solid #cfe0ff;border-radius:10px;background:#fff;
    padding:14px 12px 13px;text-align:center;overflow:hidden;color:var(--text);
    transition:transform .22s,box-shadow .22s,border-color .22s;cursor:help;}
  .dim-card::after{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;
    background:rgba(22,104,220,.05);}
  .dim-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 10px 20px rgba(22,104,220,.13);}
  .dim-card .abbr{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--primary);}
  .dim-card .v{font-size:34px;font-weight:800;line-height:1.15;color:var(--primary-dark);}
  .dim-card .cn{font-size:11.5px;font-weight:600;color:var(--text-2);}
  .dim-card .d{font-size:9.5px;line-height:1.5;color:var(--text-3);margin-top:5px;
    border-top:1px solid #eef1f6;padding-top:5px;}
  .sh-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:10.5px;color:var(--text-2);}
  .sh-foot .chip{background:#f6f9ff;border:1px solid #e3ebf7;border-radius:20px;padding:2px 10px;}
  .topo{margin-top:14px;background:linear-gradient(180deg,#fbf9ff,#fff);border:1px dashed #d5c2f3;
    border-radius:10px;padding:13px 15px;}
  .topo-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:10px;}
  .topo-head .legend{margin-left:auto;display:flex;gap:12px;font-size:10px;font-weight:400;color:var(--text-3);}
  .topo-head .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
  .topo-row{display:flex;gap:8px;flex-wrap:wrap;}
  .node-box{background:#fff;border:1px solid #dde7f6;border-radius:8px;padding:7px 9px;transition:box-shadow .2s,transform .2s;}
  .node-box:hover{box-shadow:0 6px 14px rgba(28,37,50,.10);transform:translateY(-2px);}
  .node-label{font-family:var(--mono);font-size:9px;color:var(--text-3);margin-bottom:5px;}
  .node-cells{display:flex;gap:3px;flex-wrap:wrap;}

/* ==================== 4. 工具 ==================== */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const fmt = n => (typeof n === "number" && isFinite(n))
  ? n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : esc(n);
const valHtml = v => {
  if (v === null || v === undefined) return '<span class="null-pill">无数据</span>';
  if (v === true) return '<span class="bool yes">满足</span>';
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : fmt(v);
  return `<span class="${String(v).length>16?"txt":""}">${esc(v)}</span>`;
};
const flat = (obj,prefix="") => Object.entries(obj||{}).flatMap(([k,v]) =>
  isObj(v) ? flat(v,prefix+k+".") : [[prefix+k,v]]);
const timeText = s => s ? String(s).replace("T"," ").replace(/\+08:00/,"") : "—";
function durationText(a,b){
  const d = new Date(b) - new Date(a);
  if (!isFinite(d) || d < 0) return "—";
  const m = Math.floor(d/60000), s = Math.round((d%60000)/1000);
  return m>0 ? `${m} 分 ${s} 秒` : `${s} 秒`;
}

/* ==================== 5. 解析 ==================== */
function readOptimize(resp){
  const node = (resp||{}).common?.infer_strategy_npu || {};
  const d = node.data || {}, result = d.result || {};
  const agg = result.agg?.candidates || [], dis = result.disagg?.candidates || [];
  return {
    ok: !!(agg.length || dis.length), mode: agg.length ? "agg" : "disagg",
    candidate: agg.length ? agg[0] : dis[0], count: agg.length || dis.length,
    request: d.request || {}, times: { created:d.created_at, started:d.started_at, finished:d.finished_at },
    status: { code:node.code, status:node.status, message:node.message }
  };
}
function readSimulate(resp){
  const outer = resp || {}, node = (outer.common||{}).infer_simulate || {};
  const data = node.data || {};
  return {
    failed: Number(node.code) !== 0 || node.status === "failed",
    outer: { code:outer.code, status:outer.status, message:outer.message },
    inner: { code:node.code, status:node.status, message:node.message },
    data, empty: !Object.keys(data).length,
    badModel: (String(node.message||"").match(/--model='([^']+)'/)||[])[1] || ""
  };
}

    <div class="flow-break">

      <div class="flow-node stop"><b>仿真入参校验</b>✕ 模型不在白名单</div><span class="flow-arrow">→</span>
      <div class="flow-node off"><b>负载构造 / 代价建模</b>未执行</div><span class="flow-arrow">→</span>
      <div class="flow-node off"><b>仿真指标输出</b>无数据</div>
    </div></div>`;
}

/* ==================== 12. 页脚 ==================== */
function footerHtml(){
  return `<div class="footer">
    <span>报错示例：推理寻优成功 / 模拟仿真失败（外层 code=1，内层 code=1，data {}）</span>
    <span class="spacer"></span>
    <a class="btn" href="推理寻优与仿真结果界面-报错版-寻优失败.html">查看另一版本 · 寻优失败 ${icon("split")}</a>
    <button class="btn primary" type="button" id="printBtn">${icon("print")} 打印报告</button>
  </div>`;
}

/* ==================== 13. 渲染 ==================== */
function render(optResp,simResp){
  const o = readOptimize(optResp), s = readSimulate(simResp);
  if (!o.ok){
    document.getElementById("detailArea").innerHTML = `<div class="card"><div class="note red">寻优响应中无候选结果，本页需要一份正常的寻优结果。</div></div>`;
    return;
  }
  document.getElementById("modeBadge").innerHTML = modeBadgeHtml();
  document.getElementById("hero").innerHTML = heroHtml();
  document.getElementById("alert").innerHTML = alertHtml(s);
  document.getElementById("detailArea").innerHTML =
    sectionNavHtml() + pipelineHtml() +
    secConn("01","任务信息","<b>部分失败</b>","warn") + overviewHtml(o,s) +
    secConn("02","信息采集","<b>已采集 · 已被消费</b>","") + collectHtml() +
    secConn("03","推理寻优","<b>已产出 1 条候选</b>","") + strategyHtml(o) +
    secConn("04","模拟仿真","<b>执行失败</b>","failed") + errorSimulateHtml(o,s);
  document.getElementById("footer").innerHTML = footerHtml();
  document.getElementById("printBtn").addEventListener("click",()=>window.print());
}

document.getElementById("logoIcon").innerHTML = icon("logo");
document.getElementById("sideMenu").innerHTML = [
  ["grid","集群总览",true],["target","调优工作台",false],["pulse","监控诊断中心",false],
  ["chip","模型调优",false],["doc","文档中心",false]
].map(([ico,name,arrow])=>`<div class="menu-item${name==="模型调优"?" active":""}">${icon(ico)}${esc(name)}${arrow?'<span class="arrow">▸</span>':""}</div>`).join("");

window.renderInferReport = (a,b) => render(a,b);
render(window.INFER_OPT_RESULT || OPT_OK, window.INFER_SIM_RESULT || SIM_FAILED);
</script>
</body>
</html>
