<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智算调优平台 · 模型调优（训练调优）V2 旗舰版</title>
    <style>
        :root {
            --sidebar-bg: #0a1f3c;
            --sidebar-hover: #14304c;
            --primary: #1668dc;
            --primary-dark: #0e56c0;
            --primary-2: #3d8bfd;
            --bg: #f2f4f8;
            --card: #ffffff;
            --border: #e6eaf1;
            --border-dark: #d6dce6;
            --text: #1c2532;
            --text-2: #55637a;
            --text-3: #8b96a8;
            --green: #0f9d58;
            --green-bg: #e6f6ec;
            --orange: #e8890c;
            --orange-bg: #fdf3e3;
            --red: #e1463e;
            --red-bg: #fdecea;
            --blue-bg: #e9f1fe;
            --radius: 10px;
            --shadow: 0 1px 3px rgba(28, 37, 50, .05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 6. 字体优化：正文/数字分层、抗锯齿、表格数字等宽对齐 */
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .num,
        .ov-cell .v,
        .dim .v,
        .mi .v,
        .cs-val,
        .sc-tput .v,
        .hw-item .v {
            font-family: "SF Mono", Consolas, "Courier New", monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.1px;
        }

        .layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ============ 左侧导航（平台现状复刻） ============ */
        .sidebar {
            width: 212px;
            background: linear-gradient(180deg, #0a1f3c 0%, #0c2547 100%);
            color: #c6d3e2;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 16px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, .07);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: linear-gradient(135deg, #3d8bfd, #1250b5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 17px;
            box-shadow: 0 2px 8px rgba(22, 104, 220, .45);
        }

        .logo-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            line-height: 1.25;
        }

        .logo-sub {
            font-size: 10px;
            color: #6f8cab;
            letter-spacing: .4px;
        }

        .menu {
            flex: 1;
            padding: 12px 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            margin-bottom: 4px;
            color: #a9bcd4;
            position: relative;
            transition: all .15s;
        }

        .menu-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .menu-item:hover {
            background: var(--sidebar-hover);
            color: #e6eef7;
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(61, 139, 253, .22), rgba(61, 139, 253, .08));
            color: #fff;
            font-weight: 500;
        }

        .menu-item.active::before {
            content: "";
            position: absolute;
            left: -10px;
            top: 9px;
            bottom: 9px;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--primary-2);
        }

        .menu-item .arrow {
            margin-left: auto;
            font-size: 10px;
            color: #5f7ea3;
        }

        .space-bar {
            padding: 13px 12px;
            border-top: 1px solid rgba(255, 255, 255, .07);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .space-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2fbf71;
            flex-shrink: 0;
            box-shadow: 0 0 6px rgba(47, 191, 113, .8);
        }

        .space-name {
            font-size: 12px;
            color: #c6d3e2;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .space-btn {
            background: #24466e;
            color: #dce7f2;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            padding: 3px 10px;
            cursor: pointer;
        }

        /* ============ 顶栏 ============ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 48px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--blue-bg);
            color: var(--primary);
            border: none;
            border-radius: 17px;
            padding: 6px 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .crumb {
            font-size: 13px;
            color: var(--text-3);
        }

        .crumb b {
            color: var(--text);
            font-weight: 500;
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-2);
        }

        .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4d8ef7, #1668dc);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        /* ============ 页面主体 ============ */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 36px;
        }

        .page-head {
            margin-bottom: 18px;
        }

        .page-head h1 {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .page-head p {
            font-size: 13px;
            color: var(--text-2);
            margin-top: 7px;
            line-height: 1.75;
        }

        .page-head p b {
            color: var(--primary);
            font-weight: 600;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* ============ 模块标题：左对齐章节层级 ============ */
        .sec-conn {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 46px;
            margin: 25px 0 10px;
        }

        .sec-conn:first-child {
            margin-top: 2px;
        }

        .sec-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border: 1px solid #d9e6f8;
            border-radius: 10px;
            color: var(--primary);
            background: linear-gradient(145deg, #fff 0%, #eaf2ff 100%);
            box-shadow: 0 2px 5px rgba(22, 104, 220, .04);
        }

        .sec-icon svg {
            width: 19px;
            height: 19px;
        }

        .sec-heading {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: .4px;
            color: #24344b;
        }

        .sec-rule {
            flex: 1;
            min-width: 12px;
            height: 1px;
            margin-left: 8px;
            background: linear-gradient(90deg, #dbe2ed, rgba(219, 226, 237, .25));
        }

        .sec-extra {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border: 1px solid #dcece5;
            border-radius: 6px;
            background: #f4faf7;
            font-size: 11px;
            color: var(--text-2);
            white-space: nowrap;
        }

        .sec-extra b {
            color: #16815a;
            font-weight: 500;
        }

        .sec-index {
            padding-left: 12px;
            border-left: 1px solid #dce3ee;
            color: #9aa8bc;
            font: 500 12px/1 "SF Mono", Consolas, monospace;
            letter-spacing: 1px;
        }

        @media (max-width: 760px) {
            .sec-conn {
                gap: 9px;
            }

            .sec-heading {
                font-size: 14px;
                letter-spacing: 0;
            }

            .sec-extra {
                font-size: 10px;
                padding: 4px 6px;
            }

            .sec-index {
                display: none;
            }
        }

        /* 状态标签 */
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            border-radius: 4px;
            padding: 2px 8px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .tag::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .tag.ok {
            background: var(--green-bg);
            color: var(--green);
        }

        .tag.type {
            background: var(--blue-bg);
            color: var(--primary);
        }

        /* ============ 任务信息卡 ============ */
        .overview {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
        }

        .ov-top {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ov-model {
            font-size: 16px;
            font-weight: 600;
        }

        .ov-id {
            font-size: 11.5px;
            color: var(--text-3);
            font-family: "SF Mono", Consolas, monospace;
            background: #f0f3f7;
            border-radius: 4px;
            padding: 2px 8px;
        }

        .ov-cost {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-3);
        }

        .ov-cost b {
            color: var(--text-2);
            font-weight: 500;
        }

        .ov-specs {
            display: flex;
            margin-top: 13px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .ov-cell {
            flex: 1;
            padding: 0 16px;
            border-right: 1px solid var(--border);
        }

        .ov-cell:first-child {
            padding-left: 0;
        }

        .ov-cell:last-child {
            border-right: none;
        }

        .ov-cell .k {
            font-size: 11.5px;
            color: var(--text-3);
            margin-bottom: 4px;
        }

        .ov-cell .v {
            font-size: 14px;
            font-weight: 600;
        }

        .ov-cell .v small {
            font-weight: 400;
            color: var(--text-3);
            font-size: 11px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* ============ 采集信息卡 ============ */
        .hw-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
        }

        .hw-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .hw-head .tag-src {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-3);
        }

        .hw-note {
            font-size: 11.5px;
            color: var(--text-3);
            margin-bottom: 12px;
        }

        .hw-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .hw-item {
            background: #f8fafd;
            border: 1px solid #eef2f8;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .hw-ico {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: var(--blue-bg);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .hw-item .k {
            font-size: 10.5px;
            color: var(--text-3);
        }

        .hw-item .v {
            font-size: 13px;
            font-weight: 700;
            margin-top: 1px;
        }

        .hw-item .v small {
            font-size: 10px;
            color: var(--text-3);
            font-weight: 400;
        }

        /* ============ 策略卡片 ============ */
        .strat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .strat-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            display: flex;
            flex-direction: column;
            transition: box-shadow .15s, transform .15s;
        }

        .strat-card:hover {
            box-shadow: 0 6px 16px rgba(28, 37, 50, .09);
            transform: translateY(-2px);
        }

        .strat-card.best {
            border-color: #f0c36d;
            box-shadow: 0 0 0 1px #f0c36d;
        }

        .sc-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        .rank-dot {
            height: 22px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            padding: 0 8px;
            font-family: "SF Mono", Consolas, monospace;
        }

        .r1 {
            background: linear-gradient(135deg, #f7c04a, #e8890c);
        }

        .r2 {
            background: linear-gradient(135deg, #9fb3c8, #6b8299);
        }

        .r3 {
            background: linear-gradient(135deg, #d8a17c, #b5764a);
        }

        .best-tag {
            font-size: 11px;
            background: linear-gradient(135deg, #f5a623, #e8890c);
            color: #fff;
            border-radius: 4px;
            padding: 1px 7px;
            font-weight: 500;
        }

        .sc-tput {
            margin-left: auto;
            text-align: right;
        }

        .sc-tput .v {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.1;
        }

        .sc-tput .k {
            font-size: 10.5px;
            color: var(--text-3);
            margin-top: 1px;
        }

        /* 并行维度数字方块 */
        .dim-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 12px 14px 0;
        }

        .dim {
            background: #f6f8fb;
            border-radius: 6px;
            padding: 7px 0;
            text-align: center;
            cursor: help;
        }

        .dim .v {
            font-size: 14.5px;
            font-weight: 700;
        }

        .dim .k {
            font-size: 10.5px;
            color: var(--text-3);
            margin-top: 2px;
        }

        /* 开关 pill */
        .sw-row {
            display: flex;
            gap: 6px;
            padding: 10px 14px 0;
            flex-wrap: wrap;
        }

        .sw {
            font-size: 11px;
            border-radius: 11px;
            padding: 2px 9px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .sw::before {
            content: "";
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
        }

        .sw.on {
            background: var(--green-bg);
            color: var(--green);
        }

        .sw.off {
            background: #f0f3f7;
            color: var(--text-3);
        }

        /* 3. 各 stage 层数：带解释 */
        .sc-layer {
            padding: 9px 14px 0;
            font-size: 11.5px;
            color: var(--text-3);
        }

        .sc-layer b {
            color: var(--text-2);
            font-family: "SF Mono", Consolas, monospace;
            font-weight: 600;
        }

        .sc-layer-tip {
            display: block;
            font-size: 10.5px;
            color: var(--text-3);
            margin-top: 3px;
            line-height: 1.5;
        }

        /* 仿真指标 2×2 */
        .sc-metrics {
            margin: 12px 14px 13px;
            border-top: 1px dashed var(--border);
            padding-top: 11px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 14px;
        }

        .mi .k {
            font-size: 11px;
            color: var(--text-3);
        }

        .mi .v {
            font-size: 13px;
            font-weight: 600;
            margin-top: 1px;
        }

        .mi .v small {
            font-size: 10.5px;
            color: var(--text-3);
            font-weight: 400;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* ============ 对比柱状图 ============ */
        .chart-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 16px 20px;
        }

        .chart-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .2px;
        }

        .chart-sub {
            font-size: 11.5px;
            color: var(--text-3);
            margin-top: 5px;
            margin-bottom: 8px;
        }

        /* 图表左右结构：左图（垂直居中）+ 右侧指标面板 */
        .chart-body {
            display: flex;
            gap: 22px;
            align-items: stretch;
        }

        /* 4. 左图整体垂直居中，避免低分辨率下顶部留白 */
        .chart-left {
            flex: 0 0 58%;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .chart-svg-wrap {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .chart-svg-wrap svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .chart-left-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .cl-title {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-2);
        }

        .chart-legend {
            display: flex;
            gap: 14px;
            font-size: 11.5px;
            color: var(--text-2);
        }

        .chart-legend span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lg-dot {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .chart-side {
            flex: 1;
            border-left: 1px solid var(--border);
            padding-left: 22px;
            display: flex;
            flex-direction: column;
        }

        .cs-title {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 4px;
        }

        .cs-sub {
            font-size: 11px;
            color: var(--text-3);
            margin-bottom: 14px;
        }

        .cs-groups {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            gap: 10px;
        }

        .cs-metric-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 7px;
        }

        .cs-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 3.5px 0;
        }

        .cs-rank {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            font-size: 10.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cs-rank.r1 {
            background: var(--orange);
            color: #fff;
        }

        .cs-rank.r2 {
            background: #e3eaf5;
            color: #5b6b84;
        }

        .cs-rank.r3 {
            background: #eef2f8;
            color: #9aa6b9;
        }

        .cs-val {
            width: 96px;
            min-width: 96px;
            white-space: nowrap;
            font-size: 12px;
            color: var(--text);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            background: #fff;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .cs-val.r1 {
            color: #d97b06;
            font-weight: 700;
        }

        .cs-track {
            flex: 1;
            height: 8px;
            background: #f3f5fa;
            border-radius: 4px;
            overflow: hidden;
        }

        .cs-bar {
            height: 100%;
            border-radius: 4px;
        }

        .cs-bar.r1 {
            background: #f0b264;
        }

        .cs-bar.r2 {
            background: #bccbe6;
        }

        .cs-bar.r3 {
            background: #d6e0f0;
        }

        .cs-note {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            font-size: 11px;
            color: var(--text-3);
            line-height: 1.6;
        }

        /* ============ 8. 工具基本原理（左右双面板） ============ */
        .pr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .pr-panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
        }

        .pr-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

                <div class="page-head">

                        三步：基于预采集的实测数据筛出可行的并行策略，逐个模拟预估吞吐、显存等指标，直接推荐性能最好的

    <script>
        /* ================= 数据（字段与接口文档 v1.0.0 一致） ================= */
        const TASK={
            id: "llama3-1-910b2-1109-0907",model: "llama3-1-405B",npu: "910B2",taskType: "预训练",
            seq: 8192,gbs: 64,nodes: 2,npn: 8,status: "done",time: "2026-11-09 09:07",cost: "5分28秒",
            result: {
                top_configs: [
                    {
                        rank: 1,tp: 2,pp: 1,dp: 8,mbs: 4,sp: 1,ep: 1,dist_opt: 0,recompute: 1,num_layer_list: "126",
                        tokens_per_npu_s: 5210.40,time_cost: 1298.70,peak_memory: 48210.50,tflops: 152.30,mfu: 46.20
                    },
                    {
                        rank: 2,tp: 4,pp: 1,dp: 4,mbs: 2,sp: 1,ep: 1,dist_opt: 0,recompute: 1,num_layer_list: "126",
                        tokens_per_npu_s: 5065.10,time_cost: 1342.15,peak_memory: 45120.00,tflops: 147.80,mfu: 44.60
                    },
                    {
                        rank: 3,tp: 1,pp: 2,dp: 8,mbs: 4,sp: 0,ep: 1,dist_opt: 1,recompute: 0,num_layer_list: "63,63",
                        tokens_per_npu_s: 4902.70,time_cost: 1410.33,peak_memory: 43680.20,tflops: 140.50,mfu: 42.50
                    }
                ]
            }
        };

        /* NPU 硬件规格库（采集信息）
           - 单卡算力 / 显存容量：静态规格（算力用于 MFU，显存用于可行性判断）
           - 卡间带宽：P2P 带宽微基准实测（1MB~1GB 分档发包，取 1GB 饱和档），
             数据来源 profiled-data 目录下 p2p_intra_node.csv / p2p_inter_node.csv */
        const HW_SPEC={
            "910B2": [
                {ico: "⚡",k: "单卡算力 (FP16)",v: "376",u: "TFLOPS"},
                {ico: "▣",k: "HBM 显存容量",v: "64",u: "GB"},
                {ico: "⇄",k: "节点内卡间带宽",v: "24.23",u: "GB/s"},
                {ico: "⛓",k: "节点间卡间带宽",v: "11.00",u: "GB/s"}
            ],
            "950DT": [
                {ico: "⚡",k: "单卡算力 (FP16)",v: "486",u: "TFLOPS"},
                {ico: "▣",k: "HBM 显存容量",v: "96",u: "GB"},
                {ico: "⇄",k: "节点内卡间带宽",v: "46.95",u: "GB/s"},
                {ico: "⛓",k: "节点间卡间带宽",v: "219.46",u: "GB/s"}
            ]
        };

        const fmt=n => n.toLocaleString("en-US",{minimumFractionDigits: 2,maximumFractionDigits: 2});

        /* ================= 模块章节标题 ================= */
        function secConn (no,name,extra) {
            const icons={
                "01": '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6M9 13h6M9 17h4"/>',
                "02": '<rect x="3" y="3" width="18" height="6" rx="2"/><rect x="3" y="15" width="18" height="6" rx="2"/><path d="M7 6h.01M7 18h.01M12 9v6M10 12h4"/>',
                "03": '<path d="M8 3h8v5a4 4 0 0 1-8 0V3ZM8 5H4v2a4 4 0 0 0 4 4M16 5h4v2a4 4 0 0 1-4 4M12 12v5M8 21h8M9 17h6v4"/>',
                "04": '<path d="M4 3v17h17M8 16v-5M13 16V7M18 16v-3"/>',
                "05": '<rect x="8" y="8" width="8" height="8" rx="2"/><path d="M9 3v5M15 3v5M9 16v5M15 16v5M3 9h5M3 15h5M16 9h5M16 15h5"/>'
            };
            return `<div class="sec-conn" id="section-${no}">
      <span class="sec-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[no]||icons["01"]}</svg></span>
      <h2 class="sec-heading">${name}</h2>
      <span class="sec-rule" aria-hidden="true"></span>
      ${extra? `<span class="sec-extra">${extra}</span>`:""}
      <span class="sec-index" aria-hidden="true">${no} / 05</span>
    </div>`;
        }

        /* ================= 2. 任务信息卡 ================= */
        function overviewHtml (t) {
            return `<div class="overview">
    <div class="ov-top">
      <span class="ov-model">${t.model}</span>
      <span class="tag type">${t.taskType}</span>
      <span class="ov-id">${t.id}</span>
      <span class="ov-cost">创建于 <b>${t.time}</b> · 耗时 <b>${t.cost}</b></span>
    </div>
    <div class="ov-specs">
      <div class="ov-cell"><div class="k">NPU 机型</div><div class="v">${t.npu}</div></div>
      <div class="ov-cell"><div class="k">序列长度</div><div class="v">${t.seq} <small>tokens</small></div></div>
      <div class="ov-cell"><div class="k">全局批大小</div><div class="v">${t.gbs}</div></div>
      <div class="ov-cell"><div class="k">集群规格</div><div class="v">${t.nodes} × ${t.npn} <small>= ${t.nodes*t.npn} 卡</small></div></div>
    </div>
  </div>`;
        }

        /* ================= 2. 采集信息卡 ================= */
        function collectHtml (t) {
            const hw=HW_SPEC[t.npu]||[];
            return `<div class="hw-card">
    <div class="hw-head">硬件采集规格 · ${t.npu}
      <span class="tag-src">一次预采集 · 多任务复用</span>
    </div>
    <div class="hw-note">卡间带宽为 P2P 微基准实测值（取大包饱和档）；单卡算力用于 MFU 计算，显存容量用于策略可行性判断。</div>
    <div class="hw-grid">
      ${hw.map(h => `<div class="hw-item">
        <span class="hw-ico">${h.ico}</span>
        <div><div class="k">${h.k}</div><div class="v">${h.v} <small>${h.u}</small></div></div>
      </div>`).join("")}
    </div>
  </div>`;
        }

        /* ================= 策略卡片（3. 各 stage 层数带解释） ================= */
        function stratCards (t) {
            const sw=(on,name) => `<span class="sw ${on? "on":"off"}">${name} · ${on? "开":"关"}</span>`;
            return t.result.top_configs.map(c => {
                const layers=c.num_layer_list.split(",");
                const totalLayers=layers.reduce((s,x) => s+(+x),0);
                const layerTip=c.pp===1
                    ? `模型共 ${totalLayers} 层，PP=1 未做流水线切分，全部由单段承载`
                    :`PP=${c.pp} 将模型 ${totalLayers} 层切为 ${c.pp} 段，各段依次承载 ${layers.join(" / ")} 层`;
                return `
    <div class="strat-card${c.rank===1? " best":""}">
      <div class="sc-head">
        <span class="rank-dot r${c.rank}">Top${c.rank}</span>

        /* ================= 4/5. 性能对比：双坐标轴分组直方图（左图垂直居中） ================= */
        function niceTicks (max) {
            const rough=max/4;
            const steps=[1,2,5,10,15,20,25,50,100,150,200,250,500,1000,1500,2000,2500,5000,10000];
            const s=steps.find(x => x>=rough)||10000;
            return {top: s*4,ticks: [0,1,2,3,4].map(i => i*s)};
        }

        function barChart (t) {
            const cs=t.result.top_configs;
            const W=620,H=252,padL=52,padR=52,padT=30,padB=34;
            const plotW=W-padL-padR,plotH=H-padT-padB;
            const tk=niceTicks(Math.max(...cs.map(c => c.tokens_per_npu_s)));
            const mf=niceTicks(Math.max(...cs.map(c => c.mfu)));
            const C_TK="#1668dc",C_TK_L="#9dbcf2",C_MF="#eda33a",C_MF_L="#f5d4a0";
            const yTk=v => padT+plotH*(1-v/tk.top);
            const yMf=v => padT+plotH*(1-v/mf.top);

            /* 横网格线 + 左轴（吞吐）刻度 + 右轴（MFU）刻度 */
            const grid=tk.ticks.map(v => {
                const y=yTk(v);
                return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${v===0? "#c9d2de":"#eef1f5"}" stroke-width="1"/>
      <text x="${padL-8}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#8b96a8" font-family="Consolas,monospace">${v}</text>`;
            }).join("");
            const rticks=mf.ticks.map(v => {
                const y=yMf(v);
                return `<text x="${W-padR+8}" y="${y+3.5}" text-anchor="start" font-size="10" fill="#c9a05e" font-family="Consolas,monospace">${v}%</text>`;
            }).join("");
            const axes=`
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="#c9d2de" stroke-width="1"/>
      <line x1="${W-padR}" y1="${padT}" x2="${W-padR}" y2="${padT+plotH}" stroke="#e8d5b5" stroke-width="1"/>
      <text x="${padL}" y="${padT-16}" text-anchor="start" font-size="10.5" fill="#8b96a8">吞吐 · Tokens/NPU/s</text>
      <text x="${W-padR}" y="${padT-16}" text-anchor="end" font-size="10.5" fill="#c9a05e">MFU · %</text>`;

            const groupW=plotW/cs.length,barW=32,gap=24;
            const bars=cs.map(c => {
                const cx=padL+groupW*(c.rank-1)+groupW/2;
                const x1=cx-barW-gap/2,x2=cx+gap/2;
                const y1=yTk(c.tokens_per_npu_s),y2=yMf(c.mfu);
                const fTk=c.rank===1? C_TK:C_TK_L;
                const fMf=c.rank===1? C_MF:C_MF_L;
                const lbColor=c.rank===1? "#e8890c":"#55637a";
                const tkLb=c.rank===1? C_TK:"#6f93d8";
                const mfLb=c.rank===1? "#c9830f":"#c9a05e";
                return `
      <rect x="${x1}" y="${y1}" width="${barW}" height="${padT+plotH-y1}" rx="4" fill="${fTk}"/>
      <rect x="${x2}" y="${y2}" width="${barW}" height="${padT+plotH-y2}" rx="4" fill="${fMf}"/>
      <text x="${x1+barW/2}" y="${y1-7}" text-anchor="middle" font-size="11" font-family="Consolas,monospace" font-weight="700" fill="${tkLb}">${fmt(c.tokens_per_npu_s)}</text>
      <text x="${x2+barW/2}" y="${y2-7}" text-anchor="middle" font-size="11" font-family="Consolas,monospace" font-weight="700" fill="${mfLb}">${c.mfu.toFixed(1)}%</text>
      <text x="${cx}" y="${H-12}" text-anchor="middle" font-size="12.5" font-weight="${c.rank===1? 700:500}" fill="${lbColor}">Top${c.rank}${c.rank===1? " ★":""}</text>`;
            }).join("");

            /* 右侧面板：图表未覆盖的三项仿真指标 */
            const sideGroups=[
                {name: "迭代时间 (ms)",get: c => c.time_cost,lower: true},
                {name: "峰值显存 (MB)",get: c => c.peak_memory,lower: true},
                {name: "单卡算力 (TFLOPS)",get: c => c.tflops,lower: false}
            ].map(m => {
                const max=Math.max(...cs.map(m.get));
                const rows=cs.map(c => `
        <div class="cs-row">
          <span class="cs-rank r${c.rank}">${c.rank}</span>
          <span class="cs-val r${c.rank}">${fmt(m.get(c))}</span>
          <div class="cs-track"><div class="cs-bar r${c.rank}" style="width:${(max>0? m.get(c)/max*100:0).toFixed(1)}%"></div></div>
        </div>`).join("");
                return `<div class="cs-group"><div class="cs-metric-name">${m.name}</div>${rows}</div>`;
            }).join("");

            return `<div class="chart-card">
    <div class="chart-head"><span class="chart-title">Top3 仿真结果</span></div>
    <div class="chart-sub">左图：吞吐与 MFU 双柱对比（双纵轴独立刻度）；右侧：其余三项仿真指标原始值</div>
    <div class="chart-body">
      <div class="chart-left">
        <div class="chart-left-head">
          <span class="cl-title">吞吐与 MFU 对比</span>
          <div class="chart-legend">
            <span><i class="lg-dot" style="background:${C_TK}"></i>吞吐（Tokens/NPU/s）</span>
            <span><i class="lg-dot" style="background:${C_MF}"></i>MFU（%）</span>
          </div>
        </div>
        <div class="chart-svg-wrap">
          <svg viewBox="0 0 ${W} ${H}">${grid}${rticks}${axes}${bars}</svg>
        </div>
      </div>
      <div class="chart-side">
        <div class="cs-title">其余仿真指标</div>
        <div class="cs-sub">迭代时间、峰值显存与单卡算力</div>
        <div class="cs-groups">${sideGroups}</div>
        <div class="cs-note">比例条按各指标 Top3 最大值归一，数值均为仿真环节输出的原始值。</div>
      </div>
    </div>
  </div>`;
        }
